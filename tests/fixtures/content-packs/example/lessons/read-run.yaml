id: ex_read_run
status: ready
title: Read a plan run
summary: A guided tour of a made-up run page, from its state to its plan checks.
objective: Say whether a run applied anything, and where the evidence is.
difficulty: intro
learn:
  text:
    - Before you judge a change, confirm what you are looking at. A run page answers four questions; the tour shows where.
  views:
    - kind: tour
      title: Find your way around a run (fictional)
      image: assets/run-page.svg
      ratio: 0.5333   # the image's height divided by its width, for the close-up
      alt: A made-up run page with a state, a commit, tabs and a planning log
      stops:
        - {x: 6.0, y: 7.8, w: 28.3, h: 5.9, title: The run and its state, text: "**Finished** means the run stopped. It does not say what it did; read the next line."}
        - {x: 6.0, y: 14.4, w: 37.3, h: 3.8, title: What it ran, text: The stack, the commit and the environment. Check the commit matches the change you are reviewing.}
        - {x: 6.0, y: 23.8, w: 18.7, h: 5.9, title: How much would change, text: The Changes tab counts the planned changes. Open it to see each one.}
        - {x: 11.0, y: 69.1, w: 35.7, h: 3.8, title: The plan itself, text: "Add, change and destroy counts. **0 to destroy** doesn't mean safe: a change in place can still alter access."}
        - {x: 11.0, y: 84.1, w: 14.8, h: 3.8, title: The checks, text: "**Plan checks are GO** means the policies passed. It still hasn't been applied."}
check:
  question: The run says Finished and Proposed. Has the change been applied?
  options: [Yes, it finished, "No: it planned and stopped", Only half of it]
  answer: 1
  why: Proposed means planned, waiting; applying is a separate step.
practice:
  kind: multiple_choice
  prompt: Which line on the run page proves nothing was applied yet?
  artifacts:
    - kind: tour
      label: The same run
      image: assets/run-page.svg
      stops:
        - {x: 6.0, y: 19.1, w: 19.0, h: 3.8, title: This line, text: Proposed (planned, not applied).}
  options: [FINISHED, "Proposed (planned, not applied)", Plan checks are GO]
  answer: 1
  why: Finished and the checks describe the plan; Proposed says it hasn't been applied.
explain:
  pattern: Confirm what you're looking at
  reasoning: A run's state, commit and plan counts answer different questions; read all of them before deciding.
  say: I check the run's state, its commit and its plan before I judge a change.
  steps: [Read the state, check the commit, open the changes, read the plan checks.]
