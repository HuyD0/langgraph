[project]
name = "ai-starter"
version = "0.1.0"
description = "LangGraph agent template wired for Azure OpenAI + Databricks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",      # AzureChatOpenAI
    "databricks-langchain",        # ChatDatabricks, vector search, UC functions as tools
    "databricks-sdk",
    "mlflow>=3.0",                 # tracing + experiment tracking (local or Databricks)
    "azure-identity",              # DefaultAzureCredential (no keys in code)
    "python-dotenv",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]",        # `langgraph dev` -> LangGraph Studio
    "jupyter",
    "ipykernel",
    "ruff",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_starter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
