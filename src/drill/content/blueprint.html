<title>Unity Gateway Blueprint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: the drawing sheet fills the stage, the order rail runs under it and the narration lives in a
   fixed reading column; on a phone the sheet sticks to the top, the narration scrolls beneath it and the
   controls sit at the thumb. Colours are the Daily Drill Platform-track tokens (teal line art on the dusk
   ground); the light theme is the same drawing as ink on drafting paper. */
:root{
  color-scheme:dark;
  --bg:#07070f; --sheet:#07070f; --surface:#13121c; --surface-2:#1c1a26; --line:#2b2836;
  --fg:#eeedf4; --muted:#a7a2b5; --ink:#eeedf4;
  --track:#34d8c4; --track-ink:#8ccfc5; --track-line:#1d4743; --track-soft:#0e2422;
  --accent:#5b8cff; --accent-ink:#0a1233;
  --hint:#e8c47a; --hint-soft:#2a2517; --pass:#7fd6b0; --fail:#ff8f9e;
  --veil:rgba(7,7,15,.74); --glow:rgba(52,216,196,.65); --shadow:rgba(0,0,0,.45);
  --serif:'Kaisei Tokumin',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --bar:56px; --panel:384px;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#eef0f4; --sheet:#f6f7f9; --surface:#ffffff; --surface-2:#e7eaf0; --line:#cdd2dc;
    --fg:#171a2b; --muted:#5b6074; --ink:#1b2440;
    --track:#0b7f74; --track-ink:#0a6b62; --track-line:#bcd9d3; --track-soft:#def3ee;
    --accent:#2f5fd8; --accent-ink:#ffffff;
    --hint:#6f5200; --hint-soft:#fff1c8; --pass:#1b6f4f; --fail:#b3261e;
    --veil:rgba(238,240,244,.8); --glow:rgba(11,127,116,.45); --shadow:rgba(23,26,43,.14);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#eef0f4; --sheet:#f6f7f9; --surface:#ffffff; --surface-2:#e7eaf0; --line:#cdd2dc;
  --fg:#171a2b; --muted:#5b6074; --ink:#1b2440;
  --track:#0b7f74; --track-ink:#0a6b62; --track-line:#bcd9d3; --track-soft:#def3ee;
  --accent:#2f5fd8; --accent-ink:#ffffff;
  --hint:#6f5200; --hint-soft:#fff1c8; --pass:#1b6f4f; --fail:#b3261e;
  --veil:rgba(238,240,244,.8); --glow:rgba(11,127,116,.45); --shadow:rgba(23,26,43,.14);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul{margin:0}
.app{height:100%;display:flex;flex-direction:column;min-height:0}

/* top bar */
.bar{flex:none;height:var(--bar);display:flex;align-items:center;gap:14px;padding-inline:var(--gl) var(--gr);border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
.brand{display:flex;flex-direction:column;flex:none;line-height:1.15}
.eyebrow{font:600 11px/1.3 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--track-ink)}
.brand h1{font:800 18px/1.15 var(--serif);letter-spacing:-.015em;white-space:nowrap}
.progress{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;justify-content:center}
.counter{font:600 13px var(--mono);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{width:min(220px,30vw);height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex:none}
.meter i{display:block;height:100%;width:0;background:var(--track);transition:width .5s ease}
.short{display:none}
.tool{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:500;color:var(--fg);background:var(--surface);white-space:nowrap}
.tool[aria-pressed="true"]{border-color:var(--track);color:var(--track-ink);background:var(--track-soft)}

/* stage */
.stage{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--panel);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"sheet panel" "rail panel"}
.sheetwrap{grid-area:sheet;min-height:0;min-width:0;position:relative;padding:10px 10px 6px var(--gl)}
.scroller{height:100%;overflow:hidden;border-radius:14px;background:var(--sheet)}
svg.bp{display:block;width:100%;height:100%;background:var(--sheet)}

/* the drawing */
.bp text{font-family:var(--sans);fill:var(--ink);font-size:13px}
.bp text.t{font-family:var(--mono);fill:var(--track-ink);font-weight:600;font-size:14px;letter-spacing:.07em}
.bp text.s{fill:var(--muted);font-size:12px}
.bp text.num{font-family:var(--mono);font-size:12px;font-weight:600;fill:var(--ink)}
.bp text.code{font-family:var(--mono);font-size:12px}
.bp text.tiny{font-size:11px}
.bp .ink{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.bp .thin{fill:none;stroke:var(--track-ink);stroke-width:1;stroke-linecap:round}
.bp .hid{fill:none;stroke:var(--track-ink);stroke-width:1;stroke-dasharray:5 5;stroke-linecap:round}
.bp .dim{fill:none;stroke:var(--muted);stroke-width:1}
.bp .dot{fill:var(--ink)}
.bp .ah{fill:var(--track-ink)}
.bp .gridline{fill:none;stroke:var(--track-line);stroke-opacity:.35}
.bp .gridline2{fill:none;stroke:var(--track-line);stroke-opacity:.7}
.bp .hatchline{stroke:var(--track-ink);stroke-opacity:.45;stroke-width:1}
.bp .frame{fill:none;stroke:var(--track);stroke-width:1}
.bp .hit{fill:#000;fill-opacity:0}
#cam{transform-box:view-box;transform-origin:0 0;transition:transform .8s cubic-bezier(.4,0,.2,1)}
.bp .layer{cursor:pointer}
.bp .layer>*{transition:opacity .5s ease}
.bp .layer.ghost>:not(.badge){opacity:.22}
.bp .layer.ghost>.badge{opacity:.7}
.bp .layer.on .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards}
.bp .layer.now .hot{filter:drop-shadow(0 0 5px var(--glow));stroke:var(--track)}
.bp .layer.now text.t{fill:var(--track)}
.bp .layer.now .badge circle{stroke:var(--track);stroke-width:1.6}
.bp .arrows{transition:opacity .5s ease}
.bp .arrows.off{opacity:0}
.bp .strip{transition:opacity .5s ease}
.bp .strip.ghost{opacity:.3}
.bp .strip.hot text{fill:var(--track)}
.bp .strip.hot .dim{stroke:var(--track)}
@keyframes draw{to{stroke-dashoffset:0}}
/* focus effects (drafts) */
.fx{pointer-events:none}
.fx[hidden]{display:none}
.bp .veil{fill:var(--veil);fill-rule:evenodd}
.bp .spotring{fill:none;stroke:var(--track);stroke-width:1.6;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

/* order rail */
.rail{grid-area:rail;border-top:1px solid var(--line);padding:8px 12px 10px var(--gl);min-width:0}
.rail ol{list-style:none;margin:0;padding:0;display:flex;gap:4px}
.rail li{flex:1 1 0;min-width:0}
.step{width:100%;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px;border-radius:10px;border:1px dashed var(--line);color:var(--muted);font-size:12px;line-height:1.2;transition:background .3s,border-color .3s,color .3s}
.step .n{font:600 11px var(--mono)}
.step .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.step.done{border-style:solid;color:var(--fg);background:var(--surface)}
.step.done .n{color:var(--pass)}
.step.now{border:1px solid var(--track);color:var(--fg);background:var(--track-soft);box-shadow:0 0 10px var(--glow)}
.rail .order{margin-top:6px;font-size:13px;line-height:1.4;color:var(--muted)}

/* the coach and the operator bar: the captions live in one strip across the bottom, with the controls */
/* the coach: Daily Drill's hero portrait (hzFace), the same drawing, in this page's tokens */
.hface{display:inline-block;width:36px;height:42px;overflow:hidden;border-radius:9px;border:1.5px solid var(--track-ink);background:color-mix(in srgb,var(--surface-2) 82%,var(--track-ink));box-shadow:0 0 10px var(--glow);flex:none}
.hface svg{display:block;width:100%;height:100%;overflow:visible}
.hface .ol{fill:color-mix(in srgb,var(--surface-2) 88%,var(--track-ink));stroke:var(--track-ink);stroke-width:1.2;stroke-linejoin:round}
.hface .seam{fill:none;stroke:var(--track-ink);stroke-width:.8;opacity:.9}
.hface .skin{fill:color-mix(in srgb,var(--accent) 10%,white);stroke:var(--track-ink);stroke-width:.7;stroke-linejoin:round}
.hface .hair{fill:color-mix(in srgb,var(--fg) 10%,white);stroke:var(--track-ink);stroke-width:1;stroke-linejoin:round;filter:drop-shadow(0 0 2px var(--glow))}
.hface .band{fill:var(--surface-2);stroke:var(--track-ink);stroke-width:.6}
.hface .smile{fill:none;stroke:color-mix(in srgb,var(--track-ink) 70%,var(--surface-2));stroke-width:.9;stroke-linecap:round}
.hface .btn{fill:none;stroke:var(--fg);stroke-width:1.1}
.capline{margin:0;font-size:15px;line-height:1.45;max-width:65ch;min-height:1.45em}
.capline.typing::after{content:"\258C";color:var(--track);animation:blink 1s steps(1) infinite;margin-left:2px}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--track);color:var(--track-ink);font:600 11px var(--mono);letter-spacing:.06em;background:var(--track-soft);width:max-content;max-width:100%}
.chip:empty{display:none}
/* the operator bar: the coach in a monitor, the caption and the controls in one strip across the bottom */
.opbar{flex:none;display:flex;align-items:center;gap:14px;padding:8px var(--gr) calc(8px + env(safe-area-inset-bottom,0px)) var(--gl);border-top:1px solid var(--line);background:var(--surface);min-width:0}
.monitor{position:relative;flex:none;display:flex;align-items:center;gap:8px;padding:5px 8px 5px 5px;border:2px solid var(--track-ink);border-radius:8px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line),0 0 12px var(--glow)}
.monitor::after{content:"";position:absolute;inset:0;border-radius:6px;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.14) 2px 3px);pointer-events:none}
.hface.mon{width:40px;height:46px;border-radius:6px;box-shadow:none;border-width:1px}
.live{font:600 10px var(--mono);letter-spacing:.08em;color:var(--track-ink);display:inline-flex;align-items:center;gap:4px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--fail);animation:blink 1.2s steps(1) infinite}
.opcap{flex:1 1 auto;min-width:0;display:grid;gap:4px}
.opcap .capline{font-size:14px;line-height:1.4;max-width:none}
.opctl{flex:none}
.opctl .controls{border:0;padding:0;background:none;display:flex;gap:8px;grid-template-columns:none;position:static}
.opctl #play{min-height:44px;width:44px;padding:0;font-size:0;border:1px solid var(--line);border-radius:10px;color:var(--track-ink)}
.opctl #play::before{content:"\25B6";font-size:16px}
.opctl #play.playing::before{content:"\275A\275A"}
.opctl #play .bar-fill{display:none}
.clog{font:12px/1.6 var(--mono);height:112px;overflow:auto;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--fg);margin-top:6px}
.cline{display:flex;gap:8px;white-space:nowrap;min-width:0}
.cline .cid{color:var(--track-ink);font-weight:600;flex:none;width:110px}
.cline .cname{flex:none;color:var(--fg)}
.cline .cdots{flex:1 1 auto;min-width:12px;border-bottom:1px dotted var(--line);margin-bottom:5px}
.cline .cstat{flex:none;font-weight:600;color:var(--pass)}
.cline .cstat.open{color:var(--hint)}
.cline .cev{flex:none;color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:40%}
.cline.type{overflow:hidden;animation:typing .9s steps(40) both}
.cline.last::after{content:"\258C";color:var(--track);animation:blink 1s steps(1) infinite;margin-left:4px}
@keyframes typing{from{max-width:0}to{max-width:100%}}
@keyframes blink{50%{opacity:0}}
.stampgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
.stampcol{display:grid;gap:6px;align-content:start;padding:6px;border:1px dashed var(--line);border-radius:10px;min-height:92px}
.stampcol h4{margin:0;font:600 11px/1.3 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stamprow{display:flex;flex-wrap:wrap;gap:6px}
.stamp{width:44px;height:44px;border-radius:50%;border:1.6px solid var(--track);color:var(--track-ink);font:600 12px var(--mono);background:var(--track-soft);display:inline-flex;align-items:center;justify-content:center;transform:rotate(-6deg)}
.stamp.todo{border-style:dotted;border-color:var(--line);color:var(--muted);background:transparent;transform:none}
.stamp.landed{animation:land .5s cubic-bezier(.2,.8,.2,1) both}
.stamp.picked{box-shadow:0 0 10px var(--glow)}
@keyframes land{from{transform:scale(1.8) rotate(10deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
.fw-radar{display:flex;gap:16px;align-items:flex-start}
.radar{width:132px;height:132px;flex:none}
.radar .ring{fill:none;stroke:var(--track-line);stroke-width:1}
.radar .axis{stroke:var(--track-line);stroke-width:1}
.radar text{font:600 9px var(--mono);letter-spacing:.06em;fill:var(--muted)}
.radar .blip{fill:var(--track);stroke:none}
.radar .blip.todo{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 2}
.radar .sweep{transform-origin:80px 80px;animation:sweep 4s linear infinite}
.radar .sweep line{stroke:var(--track);stroke-width:1.2;stroke-opacity:.8}
.radar .sweep path{fill:var(--track);fill-opacity:.12}
@keyframes sweep{to{transform:rotate(360deg)}}
.radar-side{min-width:0;display:grid;gap:4px}

/* reading column */
.panel{grid-area:panel;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface);position:relative}
.cards{flex:1 1 auto;min-height:0;overflow:auto;padding:20px 20px 12px;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--line) transparent;scrollbar-gutter:stable}
/* a fade at the foot of the reading column when there is more to scroll */
.panel .fade{position:absolute;left:0;right:0;bottom:var(--controls-h,104px);height:36px;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--surface));opacity:0;transition:opacity .2s}
.panel.can-scroll .fade{opacity:1}
.card{display:grid;gap:12px;max-width:65ch;align-content:start}
.card h2{font:800 24px/1.2 var(--serif);letter-spacing:-.015em;text-wrap:balance}
.card .lead{font-size:17px;line-height:1.5;font-weight:500}
.label{font:600 11px/1.3 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.card p,.card li{font-size:15px;line-height:1.55}
.card ul,.card ol{padding-left:18px;display:grid;gap:6px;margin:0}
.card ol li::marker{font:600 12px var(--mono);color:var(--track-ink)}
.block{display:grid;gap:4px}
.without{padding:10px 12px;border-radius:10px;background:var(--hint-soft);color:var(--hint)}
.without .label{color:var(--hint)}
.why{font-size:14px;line-height:1.5;color:var(--track-ink)}
.card a{color:var(--accent)}
.card .more{font-size:14px;color:var(--muted)}
.card .more a{display:inline-block;padding:8px 0}
.frameworks{border-top:1px solid var(--line);padding-top:6px}
.frameworks summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:13px;font-weight:500;color:var(--track-ink);list-style:none}
.frameworks summary::before{content:"\25B8";margin-right:6px;font-size:11px}
.frameworks[open] summary::before{content:"\25BE"}
.frameworks summary::-webkit-details-marker{display:none}
.frameworks p{font-size:13px;line-height:1.45;color:var(--muted);margin-top:4px}
.frameworks b{color:var(--fg);font-weight:600}
.controls{flex:none;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"back next" "play play";gap:8px;background:var(--surface)}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-weight:500;font-size:15px}
.btn:disabled{opacity:.45}
#back{grid-area:back}
#next{grid-area:next;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#play{grid-area:play;min-height:44px;background:none;border-color:transparent;color:var(--muted);font-size:14px}
#play.playing{color:var(--track-ink);border-color:var(--line)}
#play .bar-fill{display:block;height:2px;margin-top:4px;background:var(--track);width:0;transition:width .3s linear}


@media (prefers-reduced-motion: reduce){
  #cam,.bp .layer>*,.meter i,.step{transition:none}
  .bp .layer.on .draw{animation:none;stroke-dashoffset:0}
  .bp .spotring{animation:none;opacity:.9}
  .cards{scroll-behavior:auto}
  .live i,.capline.typing::after{animation:none}
}

@media (min-width:1024px) and (max-height:800px){
  .card{gap:10px}
  .cards{padding:14px 18px 8px}
}
@media (max-width:1023px){
  .app{height:auto;min-height:100%}
  .bar{gap:8px}
  .brand h1{display:none}
  .brand .eyebrow{white-space:nowrap}
  .brand .long,.counter .long{display:none}
  .short{display:inline}
  .tool{padding:0 10px;min-width:44px}
  .meter{position:absolute;left:0;right:0;bottom:-1px;width:auto;height:3px;border-radius:0;background:var(--line)}
  .counter{font-size:12px}
  .progress{justify-content:flex-start;gap:8px}
  .panel .fade{display:none}
  .stage{display:flex;flex-direction:column}
  .sheetwrap{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));z-index:4;background:var(--bg);padding:8px 0 6px}
  .scroller{height:min(44vh,400px);overflow:auto;border-radius:0;-webkit-overflow-scrolling:touch}
  .scroller svg.bp{width:max(760px,calc(min(44vh,400px) * 2.449));height:auto}
  .rail{padding:8px var(--gr) 8px var(--gl);overflow-x:auto}
  .rail ol{min-width:max-content}
  .rail li{flex:0 0 auto}
  .step{min-width:64px;padding:4px 8px}
  .rail .order{display:none}
  .opbar{position:sticky;bottom:0;z-index:5;flex-wrap:wrap;gap:8px 10px}
  .opcap{flex:1 1 200px}
  .opctl{flex:1 1 100%}
  .opctl .controls{width:100%}
  .opctl #next{flex:1 1 auto}
  .opctl .btn{white-space:nowrap}
  .opctl #back{width:44px;padding:0;font-size:0}
  .opctl #back::before{content:"\25C0";font-size:16px}
  .stampgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cline .cev{display:none}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .cards{overflow:visible;padding:16px var(--gr) 16px var(--gl)}
  .card{scroll-margin-top:calc(var(--bar) + min(44vh,400px) + 24px)}
  .controls{position:sticky;bottom:0;z-index:5;padding-inline:var(--gl) var(--gr)}
}
@media (max-width:360px){
  .brand{display:none}
}
</style>

<div class="app">
<header class="bar">
  <div class="brand">
    <span class="eyebrow"><span class="long">Azure Databricks · </span>Unity Gateway</span>
    <h1>Cutaway blueprint</h1>
  </div>
  <div class="progress" aria-live="polite">
    <span class="counter" id="counter"><span class="long" id="counterPrefix"></span><span id="counterText">Start</span><span class="long" id="counterName"></span></span>
    <div class="meter" aria-hidden="true"><i id="meter"></i></div>
  </div>
</header>

<main class="stage">
  <section class="sheetwrap" aria-label="The drawing">
    <div class="scroller" id="scroller">

      what: 'Apps, agents and coding agents call the models directly: Azure OpenAI, or the models Databricks hosts under the name system.ai (the SYSTEM.AI MODELS box). Each one keeps a provider API key, or a long-lived personal access token (PAT), in its own settings. A key is a secret string. Any program that holds it can call the model.',
      does: ['No list. Nobody knows which apps call which models, so nobody can answer an auditor or plan capacity. (Layer 1 fixes this.)', 'No identity. A key is not a person or a program; a leaked one works for anyone, for months, and three agents on one key look like one caller. (Layer 2.)', 'No permission model. Who may call what is decided app by app, by whoever has a key. Taking access away means changing every app. (Layer 3.)', 'No content check. An instruction hidden in a document goes straight to the model, and a card number goes straight out. (Layer 4.)', 'No fair share. One runaway job uses up the whole provider quota, and everyone else gets errors. (Layer 5.)', 'No fallback. When the provider is down, every app is down. Changing or retiring a model means changing every app. (Layer 6.)', 'No record. The bill has no names on it, support has no trace to follow, and there is nothing to show an auditor. (Layer 7.)', 'No control over tools. An agent can use any tool its key allows, and nobody approves a write. (Layer 8.)', 'No safe way to change things. A new prompt or model ships untested, and the users notice first. (Layer 9.)', 'No off switch. Stopping a runaway agent means finding the app, or killing the key for everyone. (Layer 10.)'],

      lead: 'Now every caller signs in. There are no more keys. Signing in gives a token that lasts about an hour.',
      what: 'Every caller signs in with OAuth, the standard way for a person or a program to sign in and get a short-lived token. People sign in as themselves. Apps and agents sign in as their own service principal (an identity for a program, with no person behind it). An agent working for a person uses that person’s token. Databricks Apps calls this user authorization; on Agent Runtime it is request-user authorization. Coding agents sign in the same way through ug, the gateway’s command-line tool, so no config holds a key.',
      does: ['Tokens expire in about an hour, so a leaked one dies fast', 'Every agent gets an identity of its own: its calls, limits and spend are its own', 'An agent acting for a person stays inside that person’s Unity Catalog access'],
      without: 'A leaked key works for anyone, from anywhere, for months. Three agents on one login look like one caller.',
      why: 'Grants, limits and records are all per identity. The gateway must know who is calling before it can do anything else.' },
    { slug: 'grants', id: 'access', lesson: 'who_may_call',  short: 'Grants', name: 'Grants', eyebrow: 'Layer 3 of 10 · Grants',
      title: 'May this identity call it?',
      lead: 'Now the gateway checks permission. It needs three grants: one for each part of the name.',
      what: 'The caller needs three Unity Catalog grants: USE CATALOG on the catalog, USE SCHEMA on the schema and EXECUTE on the model service. Grants go to groups and service principals, never to single people. Callers never get MANAGE (the right to change the service).',
      does: ['Answers PERMISSION_DENIED when any of the three is missing', 'Keeps MANAGE with the platform team, so callers can’t loosen a service', 'Can also be given by tag: a GRANT policy on a governed tag covers every model service that carries the tag. Databricks calls this attribute-based access control (ABAC)'],
      without: 'Every account user can call everything in system.ai by default, and nobody chose that.',
      why: 'A grant is given to an identity, so it only makes sense once identities exist.' },
    { slug: 'policies', id: 'guardrails', lesson: 'content_check',  short: 'Policies', name: 'Policies', eyebrow: 'Layer 4 of 10 · Policies',
      title: 'The content check',
      lead: 'Now the words are checked: the request on the way in, the answer on the way out.',
      what: 'Service policies (Beta) are guardrails attached to the service. The built-in policies screen for jailbreak attempts (prompts written to get past the model’s rules), unsafe content and sensitive data. They run on the request (ON CALL) and on the answer (ON RESULT). On a model service the jailbreak check reads only the request.',
      does: ['Blocks the request, or redacts it (blanks out the sensitive part). A blocked request still gets a normal HTTP 200 reply, and the reply itself says it was blocked, and why', 'Is attached to the service, so every caller gets the same check and no app has to write it', 'A team can write a rule of its own in SQL. The rule can look at who is calling and at the tags the app put on the request'],
      without: 'An instruction hidden in a document reaches the model untouched, and a card number goes out in plain text.',
      why: 'This is the first thing done to the request’s content itself, once the caller is known and allowed.' },
    { slug: 'limits', id: 'limits', lesson: 'fair_limits',  short: 'Limits', name: 'Rate limits', eyebrow: 'Layer 5 of 10 · Rate limits',
      title: 'How much, per minute',
      lead: 'Now each caller gets a fair share. Too much, and the gateway says wait.',
      what: 'Limits count requests a minute (QPM) and text tokens a minute (TPM). A text token is a short piece of text, about four letters long. It is not the sign-in token from layer 2. There is a ceiling for the whole service. Each user gets a default slice. A group shares a pool. A named service principal can get a limit of its own. The strictest one wins.',
      does: ['Returns error 429 (“too many requests”) when a slice is full. The app then waits and tries again, waiting a bit longer each time; this is called backoff', 'Stops one runaway agent from taking everyone’s capacity', 'Counts an agent’s tool calls a minute too. Tools come in at layer 8'],
      without: 'One stuck batch job takes the whole service, and the chat app gets 429s until morning.',
      why: 'This is the third check on a request. Layer 3 asked who may call. Layer 4 asked what may be said. This one asks how much they may use a minute. All three run before any model is chosen.' },
    { slug: 'routing', id: 'routing', lesson: 'model_fails',  short: 'Routing', name: 'Routing', eyebrow: 'Layer 6 of 10 · Routing',
      title: 'Which model answers',
      lead: 'Now the gateway chooses the model. A split lets you try a new model on a few requests. A fallback takes over when the main model fails.',
      what: 'The model service points at one or more destinations: the model provider service from layer 1 (Azure OpenAI, one credential, held once) or a Databricks-hosted model in system.ai. A traffic split shares requests across them. A canary keeps 90 percent on the main model (the sheet’s “90% share”) and sends 10 percent to the new one. Fallbacks, in order, take over when the main model fails.',
      does: ['Keeps the app answering through a provider outage', 'Tries a new model on a slice of real requests, and compares, before everyone moves', 'Makes rollback one configuration change: set the split back'],
      without: 'When the provider goes down, your app goes down with it, and a worse model reaches everyone at once.',
      why: 'Only a request that has been identified, allowed, screened and within its limit is worth routing.' },
    { slug: 'records', id: 'records', lesson: 'who_spent_what',  short: 'Records', name: 'Records', eyebrow: 'Layer 7 of 10 · Records',
      title: 'What every call leaves behind',
      lead: 'Now every call leaves a record. With this, the request path is complete.',
      what: 'Every call leaves a row in the usage table, system.ai_gateway.usage: who called, which service, how many tokens, how long it took. Once logging is on, each call also leaves a trace: the request and the answer, word for word, in a trace table (Beta) or an inference table. The audit log is different. It records what happens around the service (grants, settings, service changes). It does not record each model request.',
      does: ['Puts a name on every bit of spend. A service tag names who owns the service, and a budget can alert or block on it. A request tag splits one service’s spend by project or user, but budgets do not use request tags', 'Keeps the raw text only for a short time that is written down, then deletes it on its own (this is called auto-TTL, short for time to live)', 'Lets support follow one request id across every row it left'],
      without: 'A bill that doubled with no name on it, and a trace table that grows forever.',
      why: 'The record is written last, with everything the earlier stages learned: who called (layer 2), was allowed (3), was screened (4), stayed within its limit (5), and which model answered (6). That completes the path a request takes. The three layers left sit around it.' },
    { slug: 'mcp', id: 'tools', lesson: 'tools_front_door',  short: 'MCP', name: 'MCP services', eyebrow: 'Layer 8 of 10 · MCP services',
      title: 'An agent’s tools, governed',
      lead: 'The path is done. Now an agent’s tools get the same front door.',
      what: 'An MCP server (Model Context Protocol, the standard way an agent reaches its tools) is registered as a Unity Catalog MCP service. So an agent’s tool calls get the same front door as its model calls: grants, rate limits, service policies and records. Its other tools, Unity Catalog functions and HTTP connections, are governed with the same grants. Skills (packaged instructions a coding agent can load) are not tools: each is a Unity Catalog object of its own, shared by grant, listed in the coding-agent configuration, and every load is logged.',
      does: ['Exposes only the tools a workload needs, chosen by name or prefix', 'Asks a person before a tool that writes or sends anything out. This is called an ASK policy', 'Writes every tool call to the audit log, with a note of whether the tool could write'],
      stepsLabel: 'How one tool call travels',
      steps: ['The agent asks the MCP service for its tools. It gets only the selected ones.', 'The agent calls a tool, signed in as itself or as the person it works for.', 'The gateway checks the grants and the rate limit for tool calls.', 'The ON CALL policy runs: allow, deny, or ask a person first.', 'The gateway passes the call to the server. A managed server is one Databricks runs. A custom server is one you host, for example as a Databricks App. An external server is reached through a Unity Catalog connection, which holds the credential for that hop, so the agent never does.', 'The result comes back through the ON RESULT policy. Then the usage row, the audit event and the trace are written.'],
      without: 'An agent acts on text it read in a document, using a tool nobody meant it to have.',
      why: 'It is a second path through the same layers, so it is easiest to see once the first path is complete.' },
    { slug: 'llmops', id: 'llmops', short: 'LLMOps', name: 'LLMOps', eyebrow: 'Layer 9 of 10 · LLMOps',
      title: 'How a change reaches production',
      lead: 'Now the way a change arrives. LLMOps is the name for how changes to an AI system are tested, promoted and watched.',
      what: 'A change to a prompt, a model or a route goes to the one main branch in small steps (trunk-based development). GitHub Actions and Spacelift carry it from there. On the pull request, a quick smoke run of mlflow.genai.evaluate checks a small set of test items. Before promotion, the full test set runs. That set is frozen (the same items every time), so results can be compared. Together these two runs are the eval gate: a fail stops the change. The same commit then goes through dev, test and prod.',
      does: ['Compares the new version (the candidate) with the current one (the champion) on the same test items, and says how sure the result is', 'Promotes one commit, then watches the small canary share with scorers (checks that grade real answers)', 'Adds real requests that scored badly (from the app’s own MLflow traces, not the gateway’s records) to the test set in Unity Catalog, so the next change is tested on them'],
      without: 'A worse prompt or model ships, and the first people to notice are the users.',
      why: 'It sits above the request path because it is how any of layers 1 to 8 change safely.' },
    { slug: 'control', id: 'control', short: 'Stop', name: 'Kill switch', eyebrow: 'Layer 10 of 10 · Kill switch and drift audit',
      title: 'Stop it fast, prove it true',
      lead: 'The last layer: how to stop a runaway agent in minutes, and how to prove nothing was changed by hand.',
      what: 'There are five switches, fastest first. Cut the agent’s own rate limit to the lowest value the service accepts (a practice run in dev checks whether 0 is allowed). Add a service policy that denies that agent’s calls. Revoke EXECUTE. Disable the service principal. Drain the agent if it runs on DurableAgentServer (let the runs already started finish, start no new ones, so crash recovery restarts nothing), then stop the Agent Runtime app with agentbricks deployments stop. A daily audit also compares the workspace with the repository, so a change made by hand shows up.',
      does: ['Stops a runaway agent in minutes. A practice run measures how long each switch takes to work', 'Flips the first switch on its own when a tripwire fires. A tripwire is a rule that spots a loop, like one agent calling 50 times a minute', 'Proves grants, limits, policies, tags and how long records are kept still match the code, so nothing was changed by hand'],
      without: 'Stopping a runaway agent takes an hour of phone calls, and a grant made by hand last spring is still there.',
      why: 'It comes last because its switches are the earlier layers used in reverse: limits (layer 5), policies (layer 4), grants (layer 3) and OAuth sign-in (layer 2), then the runtime itself. Its daily audit checks the workspace against the repository that layer 9 (LLMOps) deploys from.' },
    { slug: 'complete', id: null, short: 'Done', name: 'The whole system', eyebrow: 'Complete · all 10 layers',
      title: 'The whole system',
      lead: 'Every layer is in place. This is the system you run.',
      labels: { what: 'One request, start to finish', does: 'What you have now', without: 'Without layers 9 and 10', why: 'Where next' },
      what: 'A request signs in, passes the grants, then the policies and the limits, and is routed to a model. The answer passes the output policy and is recorded. That is the lit strip along the bottom of the sheet. An agent’s tool calls pass the same gates at its MCP service: sign in, grants, policies, limits and records. The ten gaps from the start are closed, one per layer.',
      does: ['One front door, with the model behind it free to change', 'Every call identified, allowed, checked, limited, routed and recorded', 'Everything an agent touches is one kind of governed object in Unity Catalog: models, services, tools and skills, with the same grants and the same audit', 'A way to change it safely, and a way to stop it fast'],
      without: 'Without layer 9 (LLMOps), a worse prompt or model ships untested. Without layer 10 (the kill switch and the audit), a runaway agent runs for an hour, and a grant made by hand stays forever.',
      why: 'Daily Drill’s gateway lessons walk through each layer with questions to try.', link: { href: '', text: 'Open the Daily Drill lessons' } }

  // ---- the camera and the focus effects ----
  function partBox(step) {
    var l = LAYERS[step];
    if (!l || !l.id) return null;
    var b = groups[l.id].getBBox();
    return { x: b.x, y: b.y, w: b.width, h: b.height, cx: b.x + b.width / 2, cy: b.y + b.height / 2 };
  }
  function drawScale() {
    var r = svg.getBoundingClientRect();
    return Math.min(r.width / VB.w, r.height / VB.h) || 1;
  }
  function cameraFrame(step) {
    var b = partBox(step);
    if (!b || state.fit || state.fx !== 'camera') return { s: 1, tx: 0, ty: 0 };
    var k = drawScale();
    var winW = Math.min(VB.w, scroller.clientWidth / k), winH = Math.min(VB.h, scroller.clientHeight / k);
    var pad = 60;
    var s = Math.min(winW / (b.w + pad * 2), winH / (b.h + pad * 2), 2.4);
    s = Math.max(1, s);
    var cx = VB.x + VB.w / 2, cy = VB.y + VB.h / 2;
    var tx = cx - b.cx * s, ty = cy - b.cy * s;
    // keep the sheet filling the frame: no blank paper dragged in from beyond an edge
    tx = Math.min(0, Math.max(VB.w * (1 - s), tx));
    ty = Math.min(VB.y * (1 - s), Math.max((VB.y + VB.h) * (1 - s), ty));
    return { s: s, tx: tx, ty: ty };
  }
  function applyCamera(step) {
    var f = cameraFrame(step);
    cam.style.transform = f.s === 1 && f.tx === 0 && f.ty === 0 ? '' : 'translate(' + f.tx.toFixed(1) + 'px, ' + f.ty.toFixed(1) + 'px) scale(' + f.s.toFixed(3) + ')';
    return f;
  }
  function centreScroller(step, f) {
    if (!phone()) return;
    var k = drawScale();
    var b = partBox(step);
    var px, py;
    if (!b) { px = step === 0 ? scroller.clientWidth / 2 : (VB.w / 2) * k; py = (VB.h / 2) * k; }
    else { px = (b.cx * f.s + f.tx) * k; py = (b.cy * f.s + f.ty - VB.y) * k; }
    try { scroller.scrollTo({ left: px - scroller.clientWidth / 2, top: py - scroller.clientHeight / 2, behavior: reduced ? 'auto' : 'smooth' }); }
    catch (e) { scroller.scrollLeft = px - scroller.clientWidth / 2; scroller.scrollTop = py - scroller.clientHeight / 2; }
  }
  function setAttrs(node, attrs) { Object.keys(attrs).forEach(function (k) { node.setAttribute(k, attrs[k]); }); }
  // SVG elements have no .hidden property, so the attribute is set by hand.
  function show(node, on) { if (on) node.removeAttribute('hidden'); else node.setAttribute('hidden', ''); }
  // Other parts of the sheet a layer's story touches: they stay lit under the spotlight too.
  var SPOT_EXTRA = { identity: ['callers'], routing: ['models'] };
  function paintFx(step) {
    var b = partBox(step), spot = $('#fxSpot');
    show(spot, false);
    if (!b) return;
    var q = 14, holes = [];
    function hole(x, y, w, h) { holes.push('M' + x.toFixed(1) + ' ' + y.toFixed(1) + ' h' + w.toFixed(1) + ' v' + h.toFixed(1) + ' h' + (-w).toFixed(1) + ' Z'); }
    hole(b.x - q, b.y - q, b.w + q * 2, b.h + q * 2);
    (SPOT_EXTRA[LAYERS[step].id] || []).forEach(function (id) {
      var n = document.getElementById(id); if (!n) return;
      var e = n.getBBox(); hole(e.x - q, e.y - q, e.width + q * 2, e.height + q * 2);
    });
    $('#veil').setAttribute('d', 'M0 112 H1440 V700 H0 Z ' + holes.join(' '));
    setAttrs($('#spotring'), { x: b.x - q, y: b.y - q, width: b.w + q * 2, height: b.h + q * 2 });
    show(spot, true);
  }

  // ---- the reading column and the controls ----
  function paintText(step) {
    var l = LAYERS[step];
    $('#counterPrefix').textContent = step === 0 || step === LAST ? '' : 'Layer ';
    $('#counterText').textContent = step === 0 ? 'Start' : step === LAST ? 'Complete' : step + ' of 10';
    $('#counterName').textContent = step === 0 ? '' : step === LAST ? ' · all 10 layers' : ' · ' + l.name;
    meterEl.style.width = (step === 0 ? 0 : Math.min(10, step) * 10) + '%';
    steps.forEach(function (b, i) { b.classList.toggle('done', i < step); b.classList.toggle('now', i === step); b.setAttribute('aria-current', i === step ? 'step' : 'false'); b.tabIndex = i === step ? 0 : -1; });
    // on a phone the rail scrolls sideways: keep the current step in view
    var nav = railEl.parentNode;
    if (nav.scrollWidth > nav.clientWidth + 1) {
      var nr = nav.getBoundingClientRect(), sr = steps[step].getBoundingClientRect();
      var dx = (sr.left + sr.width / 2) - (nr.left + nr.width / 2);
      try { nav.scrollBy({ left: dx, behavior: reduced ? 'auto' : 'smooth' }); } catch (e) { nav.scrollLeft += dx; }
    }
    cards.forEach(function (c, i) { c.hidden = state.mode === 'buttons' && i !== step; });
    backBtn.disabled = step === 0;
    var label;
    if (step === LAST) label = 'Start over';
    else if (step === LAST - 1) label = 'See the whole system ▶';
    else label = 'Add layer ' + (step + 1) + ': ' + LAYERS[step + 1].name + ' ▶';
    nextBtn.textContent = label;
    document.title = 'Unity Gateway Blueprint';
  }

  var panelEl = $('.panel'), controlsEl = $('#controls');
  function updateFade() {
    var more = state.mode === 'buttons' && cardsEl.scrollHeight - cardsEl.scrollTop - cardsEl.clientHeight > 8;
    panelEl.classList.toggle('can-scroll', more);
    // the column takes keyboard focus only when there is something to scroll
    var tab = cardsEl.scrollHeight > cardsEl.clientHeight + 1 ? 0 : -1;
    if (cardsEl.tabIndex !== tab) cardsEl.tabIndex = tab;
    panelEl.style.setProperty('--controls-h', (controlsEl.parentNode === panelEl ? controlsEl.offsetHeight : 0) + 'px');
  }
  cardsEl.addEventListener('scroll', updateFade, { passive: true });
  var pending = null;
  function setStep(i, opts) {
    opts = opts || {};
    i = Math.max(0, Math.min(LAST, i));
    state.step = i;
    paintSheet(i);
    paintText(i);
    paintFw(i);
    if (document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('step')) { try { steps[i].focus({ preventScroll: true }); } catch (e) {} }
    var f = applyCamera(i);
    paintFx(i);
    clearTimeout(pending);
    pending = setTimeout(function () { centreScroller(i, f); }, reduced ? 0 : 60);
    if (opts.scrollCard && state.mode === 'buttons') {
      if (phone()) { try { cards[i].scrollIntoView({ block: 'start', behavior: reduced ? 'auto' : 'smooth' }); } catch (e) {} }
      else cardsEl.scrollTop = 0;
    }
    updateFade();
    try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(function () { return { step: state.step }; }); } catch (e) {}
  }

  // ---- play through ----
  function stopPlay() {
    if (!state.playing) return;
    state.playing = false;
    clearInterval(state.timer); state.timer = null;
    playBtn.classList.remove('playing');
    playBtn.firstChild.nodeValue = '▶ Play: add a layer every 20 seconds';
    playBar.style.width = '0';
  }
  function startPlay() {
    if (state.step === LAST) setStep(0, { scrollCard: true });
    state.playing = true;
    state.playStart = Date.now();
    playBtn.classList.add('playing');
    playBtn.firstChild.nodeValue = '❚❚ Pause';
    state.timer = setInterval(function () {
      var t = Date.now() - state.playStart;
      playBar.style.width = Math.min(100, t / PLAY_MS * 100) + '%';
      if (t >= PLAY_MS) {
        if (state.step >= LAST) { stopPlay(); return; }
        setStep(state.step + 1, { scrollCard: true });
        state.playStart = Date.now();
      }
    }, 250);
  }
  playBtn.addEventListener('click', function () { if (state.playing) stopPlay(); else startPlay(); });

  // ---- buttons, taps on the sheet, keys ----
  nextBtn.addEventListener('click', function () { stopPlay(); setStep(state.step === LAST ? 0 : state.step + 1, { scrollCard: true }); });
  backBtn.addEventListener('click', function () { stopPlay(); setStep(state.step - 1, { scrollCard: true }); });
  Object.keys(groups).forEach(function (id) {
    var g = groups[id], i = Number(g.dataset.step);
    g.addEventListener('click', function () { stopPlay(); setStep(i, { scrollCard: true }); });
    g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); stopPlay(); setStep(i, { scrollCard: true }); } });
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); stopPlay(); setStep(state.step + 1, { scrollCard: true }); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); stopPlay(); setStep(state.step - 1, { scrollCard: true }); }
    else if (e.key === 'Home') { e.preventDefault(); stopPlay(); setStep(0, { scrollCard: true }); }
    else if (e.key === 'End') { e.preventDefault(); stopPlay(); setStep(LAST, { scrollCard: true }); }
  });
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { var f = applyCamera(state.step); centreScroller(state.step, f); updateFade(); }, 150);
  });

  // ---- start: from the link's #slug, from a saved snapshot, or at the start ----
  function boot(data) {
    var start = 0;
    var h = (location.hash || '').replace('#', '').toLowerCase();
    LAYERS.forEach(function (l, i) { if (l.slug === h) start = i; });
    if (!h && data && typeof data.step === 'number') start = data.step;
    setStep(start);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { var f = applyCamera(state.step); paintFx(state.step); centreScroller(state.step, f); updateFade(); });
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
  else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
