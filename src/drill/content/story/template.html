<title>The Watch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Kaisei+Tokumin:wght@700;800&display=swap">
<style>
/* Daily Drill's own tokens and banner styles, stitched in by build.py: no colour in this page is typed by hand. */
/*TOKENS*/
/*HORIZON_CSS*/

/* Layout: a film frame, always in Dusk. A night sky fills the screen; the six phase banners from Home lie end to
   end along one horizon in the middle band; the camera travels along them. The top bar holds the six phases and
   the controls, the bottom bar the subtitles. Big type sits in the sky; The Watch's card sits beside or under the
   horizon; the phase's modules sit under the card. */
:root { --bar: clamp(52px, 8vh, 76px); }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--fx-veil); }
body { margin: 0; color: var(--fg); font: 16px/1.5 var(--body); overflow: hidden; }
.film { position: fixed; inset: 0; overflow: hidden; background: var(--fx-veil); }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.film.flat { background: linear-gradient(to bottom, var(--fx-veil), color-mix(in srgb, var(--path) 16%, var(--fx-veil)) 55%, var(--fx-veil)); }
.film.flat #sky { display: none; }

/* the world: Home's banners, drawn by page/horizon.js, in one svg whose viewBox is the camera */
.horizon.world { position: absolute; inset: 0; aspect-ratio: auto; max-height: none; width: 100%; height: 100%; margin: 0; border: 0; border-radius: 0; background: none; --hz-ink: var(--path); pointer-events: none; }
.horizon.world > svg { width: 100%; height: 100%; display: block; overflow: hidden; }
.horizon.world svg.cu { cursor: default; }
.horizon.world .here .mk .ln { stroke: var(--accent); }
:root[data-theme="dusk"] .horizon.world .here .mk { filter: drop-shadow(0 0 3px var(--accent)); }
.horizon.world .panel { transition: opacity 1s ease; }
.horizon.world .panel.dim { opacity: .45; }
.horizon.world .loop { fill: none; stroke: var(--fx-glow); stroke-width: 2.5; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-dasharray: 6 10; animation: hz-en-flow 1.6s linear infinite; opacity: 0; transition: opacity 1.2s ease; }
.horizon.world .loop.hi { stroke: var(--fx-core); stroke-width: 1.4; stroke-dasharray: 2 14; animation-duration: 1.1s; }
.horizon.world .loop.on { opacity: 1; }
:root[data-theme="dusk"] .horizon.world .loop { filter: drop-shadow(0 0 3px var(--fx-glow)); }
.horizon.world .stir .wob { animation-duration: .9s; }
/* the landmarks doing their phase's job (acts.js), in the banner's own line language and colours */
.horizon.world .mk path.lock { stroke: var(--accent); stroke-width: 1.8; }
:root[data-theme="dusk"] .horizon.world .mk path.lock { filter: drop-shadow(0 0 2px var(--accent)); }
.horizon.world .mk path.free { stroke: var(--fx-core); stroke-dasharray: 2 2; opacity: .9; animation: swing 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 0; }
@keyframes swing { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
.horizon.world .fx .knot { fill: var(--fx-core); stroke: var(--fx-glow); stroke-width: .8; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; transform-box: fill-box; transform-origin: center; }
:root[data-theme="dusk"] .horizon.world .fx .knot { filter: drop-shadow(0 0 3px var(--fx-glow)); }
.horizon.world .fx .thread { fill: none; stroke: var(--fx-core); stroke-width: 1; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.2s ease; opacity: .8; }
.horizon.world .fx .thread.on { stroke-dashoffset: 0; }
.horizon.world .fx .win { animation: pop .4s ease-out both; transform-box: fill-box; transform-origin: center; }
.horizon.world .fx .win.ok { fill: var(--pass); }
.horizon.world .fx .win.bad { fill: var(--fail); }
:root[data-theme="dusk"] .horizon.world .fx .win.bad { filter: drop-shadow(0 0 3px var(--fx-red)); }
@keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.horizon.world .en path.st { transition: opacity .9s ease; }
.horizon.world .en path.st.held { opacity: .06; }
.horizon.world .en path.fl { transition: opacity .7s ease, fill .5s ease; }
.horizon.world .en path.fl.held { opacity: 0; }
.horizon.world .en path.fl.bad { fill: var(--fail); }
.horizon.world .fx .pin { fill: var(--fail); stroke: var(--fail); stroke-width: .8; animation: pop .4s ease-out both; transform-box: fill-box; transform-origin: 50% 100%; }
.horizon.world .fx .lbl { transform-box: fill-box; transform-origin: center; font: 600 7px var(--body); fill: var(--fg); paint-order: stroke; stroke: var(--fx-veil); stroke-width: 2.2px; stroke-linejoin: round; animation: pop .4s ease-out both; }
.horizon.world .fx .lbl.lock { fill: var(--accent); }
.horizon.world .fx .lbl.free { fill: var(--fx-core); }
.horizon.world .fx .lbl.bad { fill: var(--fail); }
.horizon.world .named .fx .lbl, .horizon.world .panel.dim .fx .lbl { visibility: hidden; }
.horizon.world .slips .em { fill: var(--fx-core); }
:root[data-theme="dusk"] .horizon.world .slips .em { filter: drop-shadow(0 0 3px var(--fx-glow)); }
.horizon.world .pshape { opacity: 0; transition: opacity .5s ease; }
.horizon.world .pshape .sh { fill: none; stroke: var(--path-ink); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
.horizon.world .named .pshape.on { opacity: 1; animation: pop .45s cubic-bezier(.2, 1.6, .4, 1) both; transform-box: fill-box; transform-origin: center; }
.horizon.world .fx .ring { fill: none; stroke: var(--fail); stroke-width: 1.2; animation: ring 1.4s ease-out 1 both; transform-box: fill-box; transform-origin: center; }
@keyframes ring { from { transform: scale(.4); opacity: 1; } to { transform: scale(3.2); opacity: 0; } }
.horizon.world .fx path.win.bad { fill: none; stroke: var(--fail); stroke-width: 1.6; stroke-linecap: round; }
.horizon.world .rider { fill: var(--fail); opacity: 0; transition: fill .6s ease, opacity .4s ease; }
.horizon.world .rider.on { opacity: 1; }
.horizon.world .rider.home { fill: var(--fx-glow); }
:root[data-theme="dusk"] .horizon.world .rider { filter: drop-shadow(0 0 4px currentColor); }
.horizon.world .newtest { font: 600 var(--pn, 20px) var(--body); fill: var(--fx-core); paint-order: stroke; stroke: var(--fx-veil); stroke-width: 3px; opacity: 0; transition: opacity .5s ease; }
.horizon.world .newtest.on { opacity: 1; }
.horizon.world .pname { font: 600 var(--pn, 20px) var(--body); fill: var(--path-ink); letter-spacing: .02em; opacity: 0; transition: opacity .8s ease; }
.horizon.world .named .pname { opacity: 1; }
.horizon.world .slips { opacity: 0; transition: opacity 1s ease; }
.horizon.world .slipping .slips { opacity: 1; }

.bar { position: absolute; left: 0; right: 0; z-index: 6; background: var(--fx-veil);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px; }
.bar.top { top: 0; padding-top: env(safe-area-inset-top, 0px); min-height: calc(var(--bar) + env(safe-area-inset-top, 0px)); }
.bar.bot { bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); min-height: calc(var(--bar) + env(safe-area-inset-bottom, 0px)); justify-content: center; }
.phases { display: flex; gap: 4px; align-items: center; min-width: 0; flex: 1 1 auto; overflow: hidden; }
.ph { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px 5px 6px; border-radius: 999px; border: 1px solid transparent; color: var(--muted); font: 600 12.5px/1 var(--body); white-space: nowrap; transition: color .5s, border-color .5s, background .5s, box-shadow .5s, opacity .5s; opacity: .75; }
.ph svg { width: 16px; height: 16px; flex: none; overflow: visible; }
.ph .sh { fill: none; stroke: currentColor; stroke-width: 1.6; }
.ph.on { opacity: 1; color: var(--path-ink); }
.ph.here { opacity: 1; color: var(--fg); border-color: var(--path-line); background: var(--path-bg); box-shadow: var(--glow-current); }
.ph.here .sh { stroke: var(--fx-glow); fill: color-mix(in srgb, var(--fx-glow) 25%, transparent); }
@media (max-width: 760px) { .ph .t { display: none; } .ph { padding: 3px; } }
.ctrl { display: flex; gap: 6px; flex: none; }
.ctrl button { min-width: 44px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: 600 13px var(--body); padding: 0 12px; cursor: pointer; }
.ctrl button:focus-visible, .btn:focus-visible, a:focus-visible { outline: 2px solid var(--fx-glow); outline-offset: 2px; }
@media (max-width: 420px) { .ctrl button { padding: 0 9px; } }

.cap { margin: 0; max-width: 62ch; text-align: center; padding-block: 10px; font: 500 clamp(16px, 2vw, 21px)/1.45 var(--body); color: var(--fg); text-wrap: balance; transition: opacity .45s ease; }
.cap.off { opacity: 0; }
.cap b { color: var(--fail); font-weight: 600; }

.top-words { position: absolute; z-index: 3; left: max(6vw, 16px, env(safe-area-inset-left, 0px)); right: max(6vw, 16px); top: calc(var(--bar) + env(safe-area-inset-top, 0px) + 3.5vh); pointer-events: none; display: grid; gap: 8px; max-width: 900px; }
.big { margin: 0; font: 800 clamp(34px, 7vw, 96px)/1.04 var(--head); letter-spacing: -.01em; color: var(--fg); text-wrap: balance;
  text-shadow: 0 0 22px color-mix(in srgb, var(--fx-glow) 55%, transparent), 0 2px 18px var(--fx-veil); transition: opacity .6s ease, transform .9s cubic-bezier(.2, .8, .2, 1); }
.big.no { color: var(--fail); text-shadow: 0 0 22px color-mix(in srgb, var(--fx-red) 55%, transparent), 0 2px 18px var(--fx-veil); }
.line { margin: 0; font: 500 clamp(16px, 2vw, 22px)/1.4 var(--body); color: var(--path-ink); max-width: 46ch; text-wrap: balance; text-shadow: 0 1px 12px var(--fx-veil); transition: opacity .6s ease .15s, transform .9s cubic-bezier(.2, .8, .2, 1) .15s; }
.big.off, .line.off { opacity: 0; transform: translateY(12px); }

/* The Watch: its card (the example), and the modules you'll learn */
.side { position: absolute; z-index: 4; right: max(4vw, 16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px) + 3vh); width: min(430px, calc(100% - 32px)); display: grid; gap: 10px; pointer-events: none; }
.card { background: linear-gradient(var(--aside-bg), var(--aside-bg)), color-mix(in srgb, var(--fx-veil) 55%, transparent); border: 1px solid var(--aside-line); box-shadow: var(--aside-shadow), 0 14px 40px color-mix(in srgb, var(--fx-veil) 70%, transparent); backdrop-filter: var(--aside-blur); -webkit-backdrop-filter: var(--aside-blur);
  border-radius: 14px; padding: 12px 14px; transition: opacity .6s ease, transform .8s cubic-bezier(.2, .8, .2, 1); }
.card.off { opacity: 0; transform: translateY(14px); }
.card .who { display: flex; align-items: center; gap: 8px; font: 600 11.5px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.card .who i { width: 8px; height: 8px; border-radius: 50%; background: var(--fx-glow); box-shadow: var(--glow-current); }
.card p { margin: 0; font-size: 15.5px; line-height: 1.5; }
.card b { color: var(--fx-core); font-weight: 600; }
.card p + p, .card .slip + p { margin-top: 6px; }
.card .work { color: var(--muted); font-size: 14px; border-top: 1px solid var(--aside-line); padding-top: 6px; margin-top: 8px; }
.line small { display: block; font-size: .78em; color: var(--fg); margin-top: 2px; text-shadow: 0 0 3px var(--fx-veil), 0 0 6px var(--fx-veil), 0 0 10px var(--fx-veil); }
.slip { display: grid; gap: 4px; font-size: 15px; }
.slip .k { color: var(--muted); font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; }
.slip .stamp { font: 800 18px/1.2 var(--head); color: var(--fx-core); }
.slip .stamp.no { color: var(--fail); }
.slip .stamp { display: block; transition: transform .26s ease, opacity .26s ease; }
.slip .stamp.flip-out { transform: translateY(-60%); opacity: 0; }
.slip .stamp.flip-in { animation: flip-in .32s ease both; }
@keyframes flip-in { from { transform: translateY(60%); opacity: 0; } to { transform: none; opacity: 1; } }
.slip.compact { margin-bottom: 6px; }
.card .later { margin-top: 6px; }
.learn { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; transition: opacity .6s ease, transform .8s cubic-bezier(.2, .8, .2, 1); }
.learn.off { opacity: 0; transform: translateY(10px); }
.learn { display: grid; gap: 6px; }
.learn .lead, .learn .sub { font: 600 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.learn .sub { text-transform: none; letter-spacing: 0; font-size: 12.5px; }
.learn .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-grid; gap: 1px; font: 500 13.5px/1.2 var(--body); padding: 6px 11px; border-radius: 12px; background: var(--card-bg); border: 1px solid var(--path-line); color: var(--fg); box-shadow: var(--card-shadow); }
.chip b { font-weight: 600; }
.chip small { font-size: 12px; color: var(--muted); }

.panel-end { position: absolute; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px) + 12px); width: min(560px, calc(100% - 24px));
  background: linear-gradient(var(--card-bg), var(--card-bg)), color-mix(in srgb, var(--fx-veil) 80%, transparent); border: 1px solid var(--line); box-shadow: var(--card-shadow); border-radius: 16px; padding: 14px; display: grid; gap: 8px; animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }
.panel-end .hcoach p { margin: 0; font-size: 15px; }
.films { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13.5px; color: var(--muted); }
.films a { display: inline-flex; align-items: center; gap: 5px; min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--path-line); color: var(--fg); text-decoration: none; background: var(--path-bg); }
.films a:focus-visible { outline: 2px solid var(--fx-glow); outline-offset: 2px; }
.films svg { width: 14px; height: 14px; overflow: visible; }
.films .sh { fill: none; stroke: var(--path-ink); stroke-width: 1.6; }
.btn.primary:focus-visible { outline-color: var(--fx-core); }
.btn { font: 600 15px/1.3 var(--body); min-height: 48px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: var(--glow-current); }
.btn.quiet { background: transparent; }

/* phones: the card and the modules move under the horizon, full width */
@media (max-aspect-ratio: 4/5) {
  .side { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; bottom: calc(var(--bar) + env(safe-area-inset-bottom, 0px) + 10px); }
  .card p { font-size: 15px; }
  .horizon.world .fx .lbl { font-size: 12.5px; stroke-width: 3px; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<div class="film" id="film">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="horizon world" id="world" aria-hidden="true" data-awakened="false"></div>
  <div class="top-words"><p class="big off" id="big" aria-hidden="true"></p><p class="line off" id="line" aria-hidden="true"></p></div>
  <div class="side"><div class="card off" id="card" aria-hidden="true"></div><div class="learn off" id="learn" aria-hidden="true"></div></div>
  <p class="sr" id="said" aria-live="polite"></p>
  <div class="panel-end" id="end" hidden></div>
  <div class="bar top">
    <nav class="phases" id="phases" aria-label="The six phases"></nav>
    <div class="ctrl">
      <button type="button" id="back">Back</button>
      <button type="button" id="pause">Pause</button>
      <button type="button" id="skip">Skip</button>
    </div>
  </div>
  <div class="bar bot"><p class="cap off" id="cap" aria-hidden="true"></p></div>
</div>
