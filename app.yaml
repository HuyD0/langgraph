# How the Daily Drill server runs as a Databricks App. Nothing here names a workspace:
# every value that differs between workspaces comes from a resource the bundle attaches
# (databricks.yml), so the same file serves your personal workspace and work.
command: ["python", "-m", "drill.server.api"]

env:
  # The tutor's model: the Unity Gateway model service attached as "model", by its
  # three-part name, so requests go through the gateway and its limits and usage reports.
  # The app signs its requests as its own service principal; no key to keep.
  - name: DRILL_HOSTED_MODEL
    valueFrom: model
  - name: DRILL_HOSTED_AUTH
    value: databricks

  # Keeping the tutor for the course (drill.server.guard). Behind the app's login everyone shares
  # one allowance, so each person gets a share. A question costs about 1,500 tokens (load test).
  # The whole team's tutor allowance a day: 200,000 is about 130 questions. For everyone to get
  # their full share, set it to the number of learners times DRILL_PERSON_DAILY_TOKENS.
  - name: DRILL_HOSTED_DAILY_TOKENS
    value: "200000"
  # Each person's share: 15,000 is about ten questions, more than a heavy day of study asks.
  - name: DRILL_PERSON_DAILY_TOKENS
    value: "15000"
  # Someone reading the answers can't usefully ask more than one every ten seconds.
  - name: DRILL_PERSON_PER_MINUTE
    value: "6"
  # The longest prompt the page builds is the use-case skill run, about 9,000 characters plus the
  # learner's card; 20,000 leaves room for a long card or long code, and stops pasted documents.
  - name: DRILL_MAX_PROMPT_CHARS
    value: "20000"
  # The managers' weekly notes have their own allowance (about 2,500 tokens a note), never the tutor's.
  - name: DRILL_NOTES_DAILY_TOKENS
    value: "150000"

  # Progress and the study list: the Lakebase database attached as "postgres". The
  # platform also sets PGHOST, PGDATABASE and PGUSER; the tables live in their own schema.
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: DRILL_DB_SCHEMA
    value: drill

  # One MLflow trace per request, in the experiment attached as "experiment".
  - name: MLFLOW_TRACKING_URI
    value: databricks
  - name: DRILL_MLFLOW_EXPERIMENT_ID
    valueFrom: experiment
  # Traces kept in Unity Catalog need a SQL warehouse to attach feedback to them.
  - name: MLFLOW_TRACING_SQL_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # The answer checks stay tags and a span on every trace, but are not written as assessments
  # one by one (each write would wake the warehouse); `drill traces score` adds them in a batch.
  - name: DRILL_CHECKS_AS_FEEDBACK
    value: "false"
  # The page's quiet signals on tutor answers (saved, asked again...) are held and written once an
  # hour, for the same reason. Got it / Still stuck is still written straight away.
  - name: DRILL_SIGNALS_EVERY_MINUTES
    value: "60"
  # Upload traces in the background, so no answer waits on tracing.
  - name: MLFLOW_ENABLE_ASYNC_LOGGING
    value: "true"

  # An app can't scale to zero, so it stops itself after this many minutes with no
  # requests; `drill cloud start` brings it back. 0 keeps it running.
  - name: DRILL_IDLE_STOP_MINUTES
    value: "30"

  # The app's disk is wiped on every restart: only caches go here, never progress.
  - name: DRILL_HOME
    value: /tmp/daily-drill

  # Content packs. The work copy keeps its real lessons in content-packs/internal/ (one pack,
  # with the same lesson ids as the public slots in content-packs/iac-applied/). The public
  # repository has no such folder, and a folder that isn't there is skipped, so the public
  # build loads nothing. The line is the same in both copies and is never edited at work.
  - name: DRILL_CONTENT_PACKS
    value: content-packs/internal
