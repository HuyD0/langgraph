[project]
name = "interview-drill"
version = "0.1.0"
description = "An agentic coding-interview tutor built on LangGraph, traced and evaluated with MLflow."
authors = [{ name = "huy.d@hotmail.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Graph orchestration
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",

    # Azure AI Foundry. Two endpoint flavours are supported, see src/drill/llm.py:
    #   - Azure OpenAI deployments  -> langchain-openai's AzureChatOpenAI
    #   - Foundry /models endpoint  -> langchain-azure-ai's AzureAIChatCompletionsModel
    "langchain-openai>=1.0,<2",
    "langchain-azure-ai>=1.0,<2",
    "azure-identity>=1.15",

    # Tracing, run tracking and evaluation
    "mlflow>=3.0,<4",

    # CLI
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.scripts]
drill = "drill.cli:app"

[dependency-groups]
dev = [
    "ipytest>=0.14.2",
    "jupyterlab>=4.6.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_llm: requires live Azure AI Foundry credentials",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
