name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first, so a stack of queued runs
# does not sit there testing commits nobody is waiting on any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # One Python, the one used day to day. Testing the floor and ceiling of
      # requires-python (3.10 and 3.13) doubled every run for little gain.
      PYTHON: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ env.PYTHON }}
        run: uv python install ${{ env.PYTHON }}

      - name: Install dependencies
        run: uv sync --dev --python ${{ env.PYTHON }}

      - name: Run tests
        # No Azure credentials are set, deliberately: the whole suite must pass
        # without them. If a test ever needs a live model it belongs behind the
        # needs_llm marker.
        # DRILL_DENYLIST (a repository secret, one word per line, `re:` for a pattern) lets the scrub
        # check your own names too; without it only the always-on shapes run, and the test says so.
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
          DRILL_DENYLIST: ${{ secrets.DRILL_DENYLIST }}
        run: |
          if [ -n "$DRILL_DENYLIST" ]; then
            printf '%s\n' "$DRILL_DENYLIST" > "$RUNNER_TEMP/denylist.txt"
            export DRILL_DENYLIST_FILE="$RUNNER_TEMP/denylist.txt"
          fi
          uv run --python ${{ env.PYTHON }} pytest -q

  notebooks-ship-unsolved:
    # Guards against committing a notebook with the exercises filled in, which
    # would hand students the answers. Cheap enough to be its own job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every notebook still has its TODOs
        run: |
          missing=0
          for nb in notebooks/m*.ipynb; do
            if ! grep -q "NotImplementedError" "$nb"; then
              echo "::error file=$nb::$nb has no unsolved exercises - it may have been committed with answers filled in"
              missing=1
            fi
          done
          exit $missing
