<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a course outline beside one reading column (it folds above the column on phones).
   The palette and type are Daily Drill's own tokens, so this page is an example of what it teaches. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --sunk: #e4e8ee; --code-bg: #f6f8fb; --line: #d3d9e1;
  --fg: #17202b; --muted: #5b6878;
  --accent: #2346d1; --accent-ink: #ffffff; --accent-soft: #e6ebfd;
  --pass: #157347; --pass-bg: #e3f4ea; --fail: #b42318; --fail-bg: #fdecea; --hint: #8a5a00; --hint-bg: #fdf3dc;
  --path: #6a3fd0; --path-bg: #efeafc;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --col: 760px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #07070f; --surface: #13121c; --sunk: #0c0b14; --code-bg: #0c0b14; --line: #2b2836;
  --fg: #eeedf4; --muted: #a7a2b5;
  --accent: #5b8cff; --accent-ink: #0a1233; --accent-soft: #1c1a26;
  --pass: #7fd6b0; --pass-bg: #10261f; --fail: #ff8f9e; --fail-bg: #351723; --hint: #e8c47a; --hint-bg: #2a2517;
  --path: #8b5cf6; --path-bg: #150f28; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #07070f; --surface: #13121c; --sunk: #0c0b14; --code-bg: #0c0b14; --line: #2b2836;
  --fg: #eeedf4; --muted: #a7a2b5;
  --accent: #5b8cff; --accent-ink: #0a1233; --accent-soft: #1c1a26;
  --pass: #7fd6b0; --pass-bg: #10261f; --fail: #ff8f9e; --fail-bg: #351723; --hint: #e8c47a; --hint-bg: #2a2517;
  --path: #8b5cf6; --path-bg: #150f28; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.6 var(--body); }
button, textarea { font: inherit; color: inherit; }
code { font: 0.88em var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
b { font-weight: 600; }
/* code shows exactly what you type: no joined symbols like => turning into one arrow */
code, pre, textarea.code { font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }

.shell { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 860px) { .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; } }

/* the course outline */
.outline { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 14px; }
.brand { display: grid; gap: 4px; }
.brand h1 { margin: 0; font: 800 26px/1.05 var(--display); letter-spacing: -0.015em; }
.brand p { margin: 0; font-size: 14px; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--pass); transition: width .3s; }
.meterline { font: 600 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.parts { display: grid; gap: 12px; }
.part h2 { margin: 0 0 4px; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.part ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.lsn { width: 100%; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: center; text-align: left; background: none; border: 0; border-radius: 8px; padding: 6px 8px; cursor: pointer; font-size: 14px; color: var(--fg); min-height: 36px; }
.lsn:hover { background: var(--sunk); }
.lsn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.lsn .n { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font: 600 10px var(--mono); color: var(--muted); }
.lsn.done .n { background: var(--pass); border-color: var(--pass); color: var(--surface); }
.lsn[aria-current="page"] .n { border-color: var(--accent); color: var(--accent); }
.lsn.done[aria-current="page"] .n { color: var(--surface); }
.outline .themes { display: flex; gap: 6px; }
@media (max-width: 860px) {
  .outline { position: static; }
  .parts { display: none; }
  .outline.open .parts { display: grid; }
}
.outtoggle { display: none; }
@media (max-width: 860px) { .outtoggle { display: inline-flex; } }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 500; font-size: 15px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.quiet { border-color: transparent; background: none; color: var(--muted); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.btn:focus-visible, .lsn:focus-visible, .opt:focus-visible, .tab:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (pointer: coarse) { .btn { min-height: 44px; } .lsn { min-height: 44px; } }

/* the lesson */
.lesson { display: grid; gap: 22px; max-width: var(--col); min-width: 0; }
.lesson > * { min-width: 0; }
.eyebrow { font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.lesson h1 { margin: 4px 0 0; font: 800 clamp(28px, 5vw, 38px)/1.08 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
.lesson h2 { margin: 0; font: 800 20px/1.2 var(--display); }
.idea p { margin: 0 0 12px; max-width: 65ch; }
.idea p:last-child { margin: 0; }
.keyidea { display: grid; gap: 4px; background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; font-size: 17px; }
.keyidea b { color: var(--accent); font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: 0.07em; }
.sec { display: grid; gap: 10px; }
.real { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.real .file { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; font: 600 13px var(--mono); }
.real .file span { font: 400 13px var(--body); color: var(--muted); }
pre.code { margin: 0; font: 13.5px/1.55 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; white-space: pre; overflow-x: auto; tab-size: 2; }
.real .note { margin: 0; font-size: 14px; color: var(--muted); }

/* the playground */
.play { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; min-width: 0; }
.task { padding: 16px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.task p { margin: 0; }
.taskhead { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.taskhead .tag { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--path); background: var(--path-bg); border-radius: 999px; padding: 2px 9px; }
.ed { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-width: 0; }
@media (max-width: 980px) { .ed { grid-template-columns: minmax(0, 1fr); } }
.editor { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; border-right: 1px solid var(--line); min-width: 0; }
@media (max-width: 980px) { .editor { border-right: 0; border-bottom: 1px solid var(--line); } }
.tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); background: var(--code-bg); }
.tab { border: 0; background: none; padding: 8px 12px; font: 600 13px var(--mono); color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; min-height: 40px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--hint); margin-left: 6px; vertical-align: middle; }
textarea.code { width: 100%; min-height: 260px; resize: vertical; border: 0; outline: none; background: var(--code-bg); color: var(--fg); font: 13.5px/1.6 var(--mono); padding: 12px 14px; white-space: pre; overflow: auto; tab-size: 2; display: block; }
@media (pointer: coarse) { textarea.code { font-size: 16px; } }
.edbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; border-top: 1px solid var(--line); }
.edbar .grow { flex: 1; }
.kbd { font: 12px var(--mono); color: var(--muted); }
@media (pointer: coarse) { .kbd { display: none; } }
.preview { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; }
.pvbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); font: 600 12px var(--mono); color: var(--muted); }
.pvbar .grow { flex: 1; }
.stagewrap { overflow-x: auto; background: var(--sunk); padding: 12px; min-height: 200px; }
.stage { margin: 0 auto; width: 100%; background: var(--surface); border-radius: 10px; overflow: hidden; border: 1px solid var(--line); transition: width .25s; }
.console { margin: 0; border-top: 1px solid var(--line); background: var(--code-bg); font: 12.5px/1.5 var(--mono); padding: 8px 12px; min-height: 40px; max-height: 140px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
.console .err { color: var(--fail); }
.console .out { color: var(--fg); }
.verdict { margin: 0 16px 16px; border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.verdict.ok { background: var(--pass-bg); color: var(--pass); }
.verdict.no { background: var(--fail-bg); color: var(--fail); }
.verdict.clue { background: var(--hint-bg); color: var(--hint); }
.verdict p { margin: 0; color: var(--fg); }
.help { display: flex; flex-wrap: wrap; gap: 8px; }

/* the check question */
.quiz { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.quiz .q { margin: 0; font-weight: 600; font-size: 17px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; min-height: 48px; display: flex; gap: 10px; align-items: center; }
.opt .k { font: 600 13px var(--mono); color: var(--muted); }
.opt.right { border-color: var(--pass); background: var(--pass-bg); }
.opt.wrong { border-color: var(--fail); background: var(--fail-bg); }
.opt[disabled] { cursor: default; }
.why { margin: 0; font-size: 15px; }

.where { display: grid; gap: 6px; font-size: 15px; }
.where ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.nav { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
/* Ask in line: a button under each part, a small conversation that opens right there */
.askbtn { display: none; align-items: center; gap: 6px; justify-self: start; border: 1px solid var(--line); background: var(--surface); color: var(--accent); border-radius: 999px; padding: 4px 12px; min-height: 36px; font: 600 13px var(--body); cursor: pointer; }
body.ask-on .askbtn { display: inline-flex; }
.askbtn svg { width: 15px; height: 15px; }
@media (pointer: coarse) { .askbtn { min-height: 44px; } }
.askbox { display: grid; gap: 10px; background: var(--accent-soft); border-radius: 12px; padding: 12px; min-width: 0; }
.askbox[hidden] { display: none; }
.askhead { display: flex; align-items: center; gap: 8px; font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent); }
.askhead .grow { flex: 1; }
.askquote { margin: 0; font-size: 14px; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.turn { display: grid; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
.turn.q { justify-self: end; max-width: 90%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px 12px 4px 12px; padding: 8px 12px; }
.turn.a { background: var(--surface); border-radius: 12px 12px 12px 4px; padding: 10px 12px; }
.turn.a p { margin: 0 0 8px; } .turn.a p:last-child { margin: 0; }
.turn.a pre { margin: 0 0 8px; font: 13px/1.5 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: pre; overflow-wrap: normal; }
.turn.a ul { margin: 0 0 8px; padding-left: 20px; }
.turn .meta { font-size: 13px; color: var(--muted); }
.turn.err { color: var(--fail); background: var(--fail-bg); }
.askchips { display: flex; flex-wrap: wrap; gap: 6px; }
.askchip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 4px 12px; min-height: 36px; font-size: 14px; cursor: pointer; text-align: left; }
@media (pointer: coarse) { .askchip { min-height: 44px; } }
.askform { display: flex; gap: 8px; align-items: flex-end; }
.askform textarea { flex: 1; min-width: 0; resize: vertical; min-height: 44px; font: 15px/1.4 var(--body); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); padding: 10px 12px; }
.askform textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.askoff { margin: 0; font-size: 13px; color: var(--muted); }
#selAsk { position: absolute; z-index: 30; display: none; }
#selAsk.on { display: inline-flex; }
#selAsk .askbtn { display: inline-flex; box-shadow: 0 6px 18px rgba(0, 0, 0, .18); }
/* Guiding AI: the cheat sheet and one situation at a time */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.sheet ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.sheet li::marker { font: 600 13px var(--mono); color: var(--accent); }
.sheet li b { display: block; }
.sheet li span { color: var(--muted); font-size: 15px; }
.judge { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.jtop { display: flex; align-items: center; gap: 10px; }
.jdots { display: flex; gap: 5px; margin-left: auto; }
.jdots i { width: 22px; height: 4px; border-radius: 2px; background: var(--line); }
.jdots i.ok { background: var(--pass); } .jdots i.no { background: var(--fail); } .jdots i.now { background: var(--accent); }
.judge .sit { margin: 0; font-size: 17px; }
.judge .who { font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--path); }
.judge .clue { background: var(--hint-bg); color: var(--fg); border-radius: 10px; padding: 10px 12px; margin: 0; }
.judge .clue b { color: var(--hint); }
.score { font: 800 22px var(--display); }
</style>

<div class="shell">
  <aside class="outline" id="outline">
    <div class="brand">
      <div class="eyebrow">A course built on Daily Drill</div>
      <h1>Inside page.html</h1>
      <p>Front end from scratch, using the app you already use.</p>
    </div>
    <div>
      <div class="meter" aria-hidden="true"><i id="meterFill"></i></div>
      <div class="meterline" id="meterText">0 of 19 done</div>
    </div>
    <button class="btn small outtoggle" id="outToggle" aria-expanded="false" aria-controls="parts">All lessons</button>
    <nav class="parts" id="parts" aria-label="Lessons"></nav>
    <div class="themes" role="group" aria-label="Look">
      <button class="btn small" data-look="light">Light</button>
      <button class="btn small" data-look="dark">Dusk</button>
      <button class="btn small" data-look="">System</button>
    </div>
  </aside>
  <main class="lesson" id="lesson" aria-live="polite"></main>
</div>
<div id="selAsk"><button class="askbtn" id="selAskBtn" type="button">Ask about this</button></div>

<script type="text/plain" id="r-render">
// Make text safe to put inside HTML: < becomes &lt; and so on
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Lesson text may use `code` and **bold**: escape first, then add those two
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const md = s => inline(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");

// A screen is a function that returns HTML text (cut down: the real one goes on to the example)
function learnPane() {
  const L = LESSONS[cur.id];
  if (L.pack) return packLearnPane(L, L.pack);   // a content-pack lesson is drawn differently
  if (L.cards) return cardsLearnPane(L);         // a lesson written as picture cards (page/cards.js)
  const [cap, code] = L.example, [first, ...rest] = L.learn;
  closeTrust(); closeCb();
  // a lesson may have one picture: it goes after paragraph number `after`
  const fig = L.diagram ? diagramHtml(L.diagram) : "", at = L.diagram ? L.diagram.after : -1;
  // withTrust() runs md() on the text, and adds a trust mark or an earlier lesson's sticker where one belongs
  return `${withTrust(cur.id, first, h => `<p class="intro">${h}</p>`)}${at === 0 ? fig : ""}
    ${rest.map((p, i) => `<div class="prose">${withTrust(cur.id, p, h => `<p>${h}</p>`)}</div>${at === i + 1 ? fig : ""}`).join("")}
    ...`;
}
</script>

<script type="text/plain" id="r-build">
# build.py: Python lessons in, one HTML file out
def render_page(data: dict) -> str:
    """page.html with the design tokens and the content embedded: still one HTML file."""
    template = PAGE_TEMPLATE.read_text(encoding="utf-8")
    tokens = TOKENS.read_text(encoding="utf-8")
    return (template
            .replace("/*TOKENS*/", tokens, 1)
            # "<" is escaped so no lesson text can end the <script> block: </script> and <!-- are the two sequences a browser acts on.
            .replace("/*DATA*/", json.dumps(data, ensure_ascii=False).replace("<", "\\u003c")))

let progress = { lessons: {} };
try { const raw = localStorage.getItem(KEY); if (raw) progress = JSON.parse(raw); } catch {}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lp = id => progress.lessons[id] || (progress.lessons[id] = { done: false });

function card() {
  const done = lp(lesson.id).done;
  return `<section class="card${done ? " done" : ""}">
    <h3>${esc(lesson.title)}</h3>
    <p>${done ? "Done. Nice work." : "Not done yet."}</p>
    ${done ? "" : `<button class="btn" data-done="${esc(lesson.id)}">Mark as done</button>`}
  </section>`;
}

function render() { $("app").innerHTML = card(); }

root.addEventListener("click", e => {
  const b = e.target.closest("[data-done]");
  if (!b) return;
  lp(b.dataset.done).done = true;
  try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch {}
  render();
});

render();
</script>

{ id: "events", part: 2, title: "Events: one listener for the page",
  idea: [

    "You could add a listener to every button. Daily Drill doesn't: its buttons are redrawn all the time, and new ones would have no listener. Instead there's **one listener on the whole page**, which asks \"was it a button with `data-open`?\" using `e.target.closest(\"[data-open]\")`. This is called **event delegation**.",
    "So adding a button is two steps: draw it with a new `data-` label, and add one line to that one listener. One habit to copy: a value read back from the page, like the lesson id in `data-open`, is text that anything could have changed, so the listener looks it up in the app's own list first (`knownLesson()`) and uses the list's copy, or does nothing if the id isn't there.",
  ],
  key: "One listener; buttons say what they are with data- labels; closest() finds them.",
  real: { id: "r-events", file: "src/drill/content/page.html", sub: "the one click listener (cut down)", note: "Search for `// ---------- events ----------`. Each line handles one kind of button." },
  play: { html: "p10-html", css: "p10-css", js: "p10-js", tab: "js" },

  clue: "Under the `const open = ...` line: `if (open) { $(\"picked\").textContent = open.dataset.open; }`. `dataset.open` reads `data-open`.",

{ id: "storage", part: 2, title: "Remembering: saving progress",

    "Some browsers refuse storage (private windows, for example), so Daily Drill wraps every read and write in `try { ... } catch {}`: if saving fails, the page still works. When you're signed in it also saves to your account through a **backend**, so your progress follows you between devices.",

  idea: [

{ id: "ds-what", part: 5, title: "What a design system is",
  idea: [
    "A **design system** is a team's shared decisions about how things look and behave, written down so everyone (people and AI) builds the same way. It has four parts: **tokens** (named values: colours, fonts, sizes, timings), **components** (reusable pieces: buttons, cards, chips), **rules** (how to use them), and **docs** (where all of that is explained, with examples).",
    "Good tokens are named by **meaning**, not looks. Many systems have two layers: **primitive** tokens that just name a colour (`blue-600: #2346d1`) and **semantic** tokens that say what it's for (`accent: var(--blue-600)`). Components only use the semantic ones. Daily Drill keeps it simple and names colours by meaning straight away: `--accent` is \"the next thing to do\", `--pass` is \"passed or done\".",
    "That's why a design system makes changes safe. To make Dusk's green softer, you change one value, and every passed result, done step and tick follows, while nothing else changes by accident.",
  ],
  key: "Tokens named by meaning, components built only from tokens, rules that say how.",
  real: { id: "r-ds1", file: "src/drill/content/tokens.css + docs/DESIGN_SYSTEM.md", sub: "names by meaning, and the rule behind them", note: "The full list, with what each name is for, is the tokens table in docs/DESIGN_SYSTEM.md." },
  play: { html: "p17-html", css: "p17-css", tab: "css" },
  task: "Someone built these results with raw colours, so they **don't change in Dusk**. Replace every `#` colour in the `.result` rules with the right token. Then switch the preview to Dusk to see the difference.",
  check: (r, ctx) => { const css = ctx.src.css.replace(/\/\*[\s\S]*?\*\//g, ""); const comp = css.replace(/\.page(\[data-theme="dusk"\])?\s*\{[^}]*\}/g, ""); const hex = comp.match(/#[0-9a-fA-F]{3,8}\b/); if (hex) return [false, `There's still a raw colour, ${hex[0]}, in a component rule. Swap it for var(--pass), var(--pass-bg), var(--fail) or var(--fail-bg).`]; const pass = r.querySelector(".result.pass"), fail = r.querySelector(".result.fail"); if (!pass || !fail) return [false, "Keep both results in the HTML."]; const was = ctx.page.getAttribute("data-theme"); ctx.page.setAttribute("data-theme", "dusk"); const a = getComputedStyle(pass), b = getComputedStyle(fail); const ok = a.backgroundColor === "rgb(16, 38, 31)" && a.color === "rgb(127, 214, 176)" && b.backgroundColor === "rgb(53, 23, 35)" && b.color === "rgb(255, 143, 158)"; ctx.page.setAttribute("data-theme", was || "light"); return ok ? [true, "No raw colours left, and both results follow the look. The strong colour for the words, its -bg twin behind them, just like the real verdicts."] : [false, "In Dusk the colours aren't the Dusk ones yet. Each result needs its strong colour for color and its -bg twin for background."]; },
  clue: "`.result.pass` gets `background: var(--pass-bg); color: var(--pass);`. Do the same with fail.",
  answer: { css: "a17-css" },
  quiz: { q: "Which token name is better for the blue of the main button?", opts: ["--blue", "--accent", "--button-color-2"], a: 1, why: "--accent says what it's for. If the brand turns green next year, --blue would be a lie; --accent still tells the truth." },
},
{ id: "ds-build", part: 5, title: "Building with it: pick the surface, then reuse",
  idea: [
    "When you need something new, **look for an existing component first**. The components table in `docs/DESIGN_SYSTEM.md` lists them. Most \"new\" things are an existing piece with different words.",

  const jp = t.closest("[data-jpick]"); if (jp) { const x = L[S.at], J = S.judge[x.id]; if (J.picks[J.at] == null) { J.picks[J.at] = pickIndex(jp.dataset.jpick, x.cases[J.at].opts.length); if (Object.keys(J.picks).length === x.cases.length) { S.done[x.id] = true; renderOutline(); } save(); } const y = window.scrollY; renderLesson(); window.scrollTo(0, y); return; }
  if (t.closest("[data-jclue]")) { const J = S.judge[L[S.at].id]; J.clue[J.at] = true; save(); const y = window.scrollY; renderLesson(); window.scrollTo(0, y); return; }
  const jg = t.closest("[data-jgo]"); if (jg) { const J = S.judge[L[S.at].id]; J.at = pickIndex(jg.dataset.jgo, L[S.at].cases.length + 1); save(); renderLesson(); document.querySelector(".judge")?.scrollIntoView({ block: "center" }); return; }
  if (t.closest("[data-jreset]")) { delete S.judge[L[S.at].id]; delete S.done[L[S.at].id]; save(); renderOutline(); renderLesson(); return; }
  if (t.closest("#outToggle")) { const o = $("outline").classList.toggle("open"); $("outToggle").setAttribute("aria-expanded", String(o)); return; }
});
document.addEventListener("keydown", e => {
  if (e.target.id !== "code") return;
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); pg.src[pg.tab] = e.target.value; saveDraft(); run(); return; }
  if (e.key === "Tab" && !e.shiftKey && !e.altKey) {
    e.preventDefault(); const ta = e.target, s = ta.selectionStart, en = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + "  " + ta.value.slice(en); ta.selectionStart = ta.selectionEnd = s + 2; pg.src[pg.tab] = ta.value;
  }
});
document.addEventListener("input", e => { if (e.target.id === "code" && pg) { pg.src[pg.tab] = e.target.value; clearTimeout(pg.t); pg.t = setTimeout(saveDraft, 500); } });

// ---------- ask in line: each part of a lesson can open a small conversation with Claude ----------
// Uses the page's `sample` capability: the viewer's own Claude, asked on a click, never on load.
let sampleFn = null, askOff = false;
const ASKKEY = KEY + "-ask";
let ASK = {};
try { const raw = store.get(ASKKEY); if (raw) ASK = JSON.parse(raw) || {}; } catch {}
const saveAsk = () => { try { const keep = {}; for (const k of Object.keys(ASK).slice(-40)) keep[k] = { turns: ASK[k].turns.filter(t => t.content).slice(-12), quote: ASK[k].quote }; store.set(ASKKEY, JSON.stringify(keep)); } catch {} };
const askKey = sec => L[S.at].id + ":" + sec + (sec === "sit" ? ":" + ((S.judge[L[S.at].id] || {}).at || 0) : "");
const running = {};

const SUGGEST = {
  idea: ["Explain this in plainer words", "Give me an everyday example", "Where would I see this in Daily Drill?"],
  code: ["Walk me through this line by line", "What would break if I changed this?", "Why is it written this way?"],
  task: ["Give me a clue, not the answer", "What does my code do right now?", "Why didn't my check pass?"],
  quiz: ["Help me think it through, without the answer", "Why is that the right answer?"],
  sit: ["What should I look for here?", "What would you ask the AI next?"],
  sheet: ["Which of these matter most for me?", "Give me an example of each from Daily Drill"],
  sel: ["Explain this", "Why does this matter?"],
};

function ctxFor(sec, quote) {
  const x = L[S.at];
  const parts = [
    'Course: "Inside page.html", a beginner course on how the Daily Drill learning app\'s front end is built (one HTML file, no framework, design tokens in tokens.css).',
    `Lesson ${S.at + 1} of ${L.length}: ${x.title} (part: ${PARTS[x.part]}).`,
    `The lesson's idea:\n${x.idea.join("\n")}\nIn one line: ${x.key}`,
  ];
  if (quote) parts.push(`The learner selected this text on the page:\n"""${quote}"""`);
  if (sec === "code" && x.real) parts.push(`Real code shown from ${x.real.file} (${x.real.sub}):\n${text(x.real.id)}\nNote: ${x.real.note}`);
  if (sec === "task" && pg) {
    parts.push(`The learner's task: ${x.task}`);
    for (const k of ["html", "css", "js"]) if (pg.src[k] && pg.src[k].trim()) parts.push(`Their current ${k.toUpperCase()}:\n${pg.src[k].slice(0, 6000)}`);
    const v = $("verdict") && $("verdict").textContent.trim(); if (v) parts.push(`What the checker last said: ${v}`);
    if (pg.logs && pg.logs.length) parts.push(`What their code logged: ${pg.logs.slice(-10).join(" | ")}`);
    parts.push(S.done[x.id] ? "They have already passed this task." : "They have NOT passed this task yet: give a clue first, never the whole answer, unless they clearly ask for the answer.");
  }
  if (sec === "quiz" && x.quiz) {
    const q = x.quiz, qa = S.quiz[x.id];
    parts.push(`Quiz question: ${q.q}\nOptions: ${q.opts.join(" / ")}`);
    parts.push(qa == null ? "They have NOT answered yet: help them reason, but do not reveal or hint which option is right." : `They answered "${q.opts[qa]}". The right answer is "${q.opts[q.a]}" because: ${q.why}`);
  }
  if (sec === "sit" && x.cases) {
    const J = S.judge[x.id] || { at: 0, picks: {} }, c = x.cases[J.at];
    if (c) {
      parts.push(`Practice situation (${c.who}): ${c.sit}${c.code ? "\nCode: " + c.code : ""}\nOptions: ${c.opts.join(" / ")}`);
      parts.push(J.picks[J.at] == null ? "They have NOT chosen yet: help them reason, but do not reveal which option is right." : `They chose "${c.opts[J.picks[J.at]]}". The right one is "${c.opts[c.a]}" because: ${c.why}`);
    }
  }
  if (sec === "sheet" && x.sheet) parts.push("The lesson's cheat sheet:\n" + x.sheet.map(([h, t]) => `- ${h}: ${t}`).join("\n"));
  return parts.join("\n\n");
}
const RULES = `You are a patient tutor inside a beginner course. The learner is new to coding and finds maths hard.
Answer in plain everyday words and short sentences. Explain any technical term the first time you use it. Never use Big-O or maths notation.
Keep answers short: about 40 to 150 words, unless they ask for more. Use examples from the Daily Drill app and this lesson where you can.
Formatting: plain paragraphs; short lists with "- " if useful; backticks for code names; a fenced code block only for a few lines of code.
When the context says not to reveal an answer, don't: ask a guiding question or give a clue instead.
If the question is unrelated to the lesson, answer briefly and kindly, then point back to the lesson.`;

function fmt(t) {
  const out = [], lines = String(t).split("\n");
  let code = null, list = null;
  const flushList = () => { if (list) { out.push(`<ul>${list.map(li => `<li>${inline(li)}</li>`).join("")}</ul>`); list = null; } };
  for (const ln of lines) {
    if (/^```/.test(ln.trim())) { if (code) { out.push(`<pre>${esc(code.join("\n"))}</pre>`); code = null; } else { flushList(); code = []; } continue; }
    if (code) { code.push(ln); continue; }
    const m = ln.match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/);
    if (m) { (list = list || []).push(m[1]); continue; }
    flushList();
    if (ln.trim()) out.push(`<p>${inline(ln.replace(/^#+\s*/, ""))}</p>`);
  }
  if (code) out.push(`<pre>${esc(code.join("\n"))}</pre>`);
  flushList();
  return out.join("");
}

function renderAsk(sec) {
  const box = document.querySelector(`[data-askbox="${sec}"]`); if (!box) return;
  const k = askKey(sec), th = ASK[k];
  if (!th || !th.open || askOff) { box.hidden = true; return; }
  box.hidden = false;
  const busy = running[k];
  const turns = th.turns.map(t => t.role === "user"
    ? `<div class="turn q">${esc(t.content)}</div>`
    : `<div class="turn a${t.err ? " err" : ""}">${t.content ? fmt(t.content) : '<span class="meta">Thinking…</span>'}</div>`).join("");
  const chips = th.turns.length ? "" : `<div class="askchips">${(SUGGEST[th.quote ? "sel" : sec] || SUGGEST.idea).map(q => `<button class="askchip" type="button" data-askq="${esc(q)}">${esc(q)}</button>`).join("")}</div>`;
  box.innerHTML = `<div class="askhead"><span class="grow">Ask Claude</span>${th.turns.length && !busy ? '<button class="btn quiet small" type="button" data-askclear>Clear</button>' : ""}<button class="btn quiet small" type="button" data-askclose>Close</button></div>
    ${th.quote ? `<p class="askquote">${esc(th.quote)}</p>` : ""}
    ${turns}${chips}
    <form class="askform" data-askform>
      <textarea rows="1" aria-label="Your question" placeholder="${th.turns.length ? "Ask a follow-up…" : "Ask anything about this…"}"${busy ? " disabled" : ""}></textarea>
      ${busy ? '<button class="btn" type="button" data-askstop>Stop</button>' : '<button class="btn" type="submit">Ask</button>'}
    </form>
    <p class="askoff">Answers come from Claude on your own account. Check anything important against the docs.</p>`;
}
function openAsk(sec, quote) {
  if (askOff) return;
  const k = askKey(sec);
  ASK[k] = ASK[k] || { turns: [] };
  ASK[k].open = true;
  if (quote) ASK[k].quote = quote.slice(0, 600);
  renderAsk(sec);
  const box = document.querySelector(`[data-askbox="${sec}"]`);
  if (box) { box.querySelector("textarea")?.focus({ preventScroll: true }); box.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
}
async function ask(sec, question) {
  const k = askKey(sec), th = ASK[k];
  if (!th || running[k] || !question.trim() || !sampleFn) return;
  th.turns.push({ role: "user", content: question.trim() });
  const ans = { role: "assistant", content: "" };
  th.turns.push(ans);
  const ctl = new AbortController(); running[k] = ctl; renderAsk(sec);
  const history = th.turns.slice(0, -1).filter(t => !t.err && t.content).slice(-8);
  while (history.length && history[0].role !== "user") history.shift();
  const input = [{ role: "user", content: RULES + "\n\nContext for this question:\n\n" + ctxFor(sec, th.quote) }, ...history];
  try {
    await sampleFn(input, { cache: false, signal: ctl.signal, onText: ({ text: t }) => { ans.content = t; renderAsk(sec); } });
  } catch (e) {
    const code = e && e.code;
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) {
      askOff = true; document.body.classList.remove("ask-on");
    } else if (code === "cancelled") { ans.content = e.text ? e.text + "\n\n(Stopped.)" : "Stopped."; }
    else if (code === "rate_limited") { ans.content = (e.text ? e.text + "\n\n" : "") + "That's a lot of questions at once. Wait a minute, then ask again."; ans.err = !e.text; }
    else if (code === "session_expired") { ans.content = "Your Claude session has expired. Sign in again, then ask."; ans.err = true; }
    else if (code === "refused") { ans.content = "Claude didn't answer that one. Try asking it a different way."; ans.err = true; }
    else { ans.content = (e && e.text ? e.text + "\n\n" : "") + "Something went wrong reaching Claude. Ask again in a moment."; ans.err = !(e && e.text); }
  } finally {
    delete running[k]; saveAsk(); renderAsk(sec);
    const box = document.querySelector(`[data-askbox="${sec}"]`);
    if (box && !askOff) box.querySelector("textarea")?.focus({ preventScroll: true });
  }
}
function renderAllAsk() { document.querySelectorAll("[data-askbox]").forEach(b => renderAsk(b.dataset.askbox)); }

document.addEventListener("click", e => {
  const t = e.target;
  const ab = t.closest("[data-ask]");
  if (ab) { const sec = ab.dataset.ask, k = askKey(sec); if (ASK[k] && ASK[k].open) { ASK[k].open = false; renderAsk(sec); } else openAsk(sec); return; }
  const box = t.closest("[data-askbox]"); if (!box) return;
  const sec = box.dataset.askbox;
  const q = t.closest("[data-askq]"); if (q) { ask(sec, q.dataset.askq); return; }
  if (t.closest("[data-askclose]")) { ASK[askKey(sec)].open = false; renderAsk(sec); return; }
  if (t.closest("[data-askclear]")) { ASK[askKey(sec)] = { turns: [], open: true }; saveAsk(); renderAsk(sec); return; }
  if (t.closest("[data-askstop]")) { running[askKey(sec)]?.abort(); return; }
});
document.addEventListener("submit", e => {
  const f = e.target.closest && e.target.closest("[data-askform]"); if (!f) return;
  e.preventDefault();
  const box = f.closest("[data-askbox]"), ta = f.querySelector("textarea"), v = ta.value;
  ta.value = ""; ask(box.dataset.askbox, v);
});
document.addEventListener("keydown", e => {
  const ta = e.target.closest && e.target.closest("[data-askform] textarea"); if (!ta) return;
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ta.form.requestSubmit(); }
});

// Select words in a lesson, and a button offers to ask about them
let selQuote = "", selSec = "idea";
function placeSelAsk() {
  const wrap = $("selAsk"), sel = window.getSelection();
  if (askOff || !sampleFn || !sel || sel.isCollapsed || !sel.rangeCount) { wrap.classList.remove("on"); return; }
  const txt = sel.toString().trim(), a = sel.anchorNode, node = a && (a.nodeType === 1 ? a : a.parentElement);
  if (!txt || txt.length < 2 || !node || !node.closest("#lesson") || node.closest("textarea, [data-askbox], button")) { wrap.classList.remove("on"); return; }
  const host = node.closest("[data-sec]");
  selSec = host && document.querySelector(`[data-askbox="${host.dataset.sec}"]`) ? host.dataset.sec : "idea";
  selQuote = txt;
  const r = sel.getRangeAt(0).getBoundingClientRect();
  wrap.style.left = Math.max(8, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - 170)) + "px";
  wrap.style.top = (window.scrollY + r.bottom + 8) + "px";
  wrap.classList.add("on");
}
document.addEventListener("selectionchange", () => { clearTimeout(placeSelAsk.t); placeSelAsk.t = setTimeout(placeSelAsk, 250); });
$("selAskBtn").addEventListener("mousedown", e => e.preventDefault());
$("selAskBtn").addEventListener("click", () => {
  $("selAsk").classList.remove("on");
  ASK[askKey(selSec)] = { turns: [], open: true };
  openAsk(selSec, selQuote);
  window.getSelection()?.removeAllRanges();
});

// Turn the feature on only where this page may ask Claude
(async () => {
  try { sampleFn = window.claude && typeof window.claude.use === "function" ? await window.claude.use("sample") : null; } catch { sampleFn = null; }
  if (sampleFn) { document.body.classList.add("ask-on"); renderAllAsk(); }
})();

// ---------- boot ----------
renderOutline();
renderLesson();
})();
</script>
