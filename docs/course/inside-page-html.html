<title>Inside page.html</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a course outline beside one reading column (it folds above the column on phones).
   The palette and type are Daily Drill's own tokens, so this page is an example of what it teaches. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --sunk: #e4e8ee; --code-bg: #f6f8fb; --line: #d3d9e1;
  --fg: #17202b; --muted: #5b6878;
  --accent: #2346d1; --accent-ink: #ffffff; --accent-soft: #e6ebfd;
  --pass: #157347; --pass-bg: #e3f4ea; --fail: #b42318; --fail-bg: #fdecea; --hint: #8a5a00; --hint-bg: #fdf3dc;
  --path: #6a3fd0; --path-bg: #efeafc;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --col: 760px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #07070f; --surface: #13121c; --sunk: #0c0b14; --code-bg: #0c0b14; --line: #2b2836;
  --fg: #eeedf4; --muted: #a7a2b5;
  --accent: #5b8cff; --accent-ink: #0a1233; --accent-soft: #1c1a26;
  --pass: #7fd6b0; --pass-bg: #10261f; --fail: #ff8f9e; --fail-bg: #351723; --hint: #e8c47a; --hint-bg: #2a2517;
  --path: #8b5cf6; --path-bg: #150f28; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #07070f; --surface: #13121c; --sunk: #0c0b14; --code-bg: #0c0b14; --line: #2b2836;
  --fg: #eeedf4; --muted: #a7a2b5;
  --accent: #5b8cff; --accent-ink: #0a1233; --accent-soft: #1c1a26;
  --pass: #7fd6b0; --pass-bg: #10261f; --fail: #ff8f9e; --fail-bg: #351723; --hint: #e8c47a; --hint-bg: #2a2517;
  --path: #8b5cf6; --path-bg: #150f28; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.6 var(--body); }
button, textarea { font: inherit; color: inherit; }
code { font: 0.88em var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
b { font-weight: 600; }
/* code shows exactly what you type: no joined symbols like => turning into one arrow */
code, pre, textarea.code { font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }

.shell { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 860px) { .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; } }

/* the course outline */
.outline { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 14px; }
.brand { display: grid; gap: 4px; }
.brand h1 { margin: 0; font: 800 26px/1.05 var(--display); letter-spacing: -0.015em; }
.brand p { margin: 0; font-size: 14px; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--pass); transition: width .3s; }
.meterline { font: 600 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.parts { display: grid; gap: 12px; }
.part h2 { margin: 0 0 4px; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.part ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.lsn { width: 100%; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: center; text-align: left; background: none; border: 0; border-radius: 8px; padding: 6px 8px; cursor: pointer; font-size: 14px; color: var(--fg); min-height: 36px; }
.lsn:hover { background: var(--sunk); }
.lsn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.lsn .n { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font: 600 10px var(--mono); color: var(--muted); }
.lsn.done .n { background: var(--pass); border-color: var(--pass); color: var(--surface); }
.lsn[aria-current="page"] .n { border-color: var(--accent); color: var(--accent); }
.lsn.done[aria-current="page"] .n { color: var(--surface); }
.outline .themes { display: flex; gap: 6px; }
@media (max-width: 860px) {
  .outline { position: static; }
  .parts { display: none; }
  .outline.open .parts { display: grid; }
}
.outtoggle { display: none; }
@media (max-width: 860px) { .outtoggle { display: inline-flex; } }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 500; font-size: 15px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.quiet { border-color: transparent; background: none; color: var(--muted); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.btn:focus-visible, .lsn:focus-visible, .opt:focus-visible, .tab:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (pointer: coarse) { .btn { min-height: 44px; } .lsn { min-height: 44px; } }

/* the lesson */
.lesson { display: grid; gap: 22px; max-width: var(--col); min-width: 0; }
.lesson > * { min-width: 0; }
.eyebrow { font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.lesson h1 { margin: 4px 0 0; font: 800 clamp(28px, 5vw, 38px)/1.08 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
.lesson h2 { margin: 0; font: 800 20px/1.2 var(--display); }
.idea p { margin: 0 0 12px; max-width: 65ch; }
.idea p:last-child { margin: 0; }
.keyidea { display: grid; gap: 4px; background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; font-size: 17px; }
.keyidea b { color: var(--accent); font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: 0.07em; }
.sec { display: grid; gap: 10px; }
.real { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.real .file { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; font: 600 13px var(--mono); }
.real .file span { font: 400 13px var(--body); color: var(--muted); }
pre.code { margin: 0; font: 13.5px/1.55 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; white-space: pre; overflow-x: auto; tab-size: 2; }
.real .note { margin: 0; font-size: 14px; color: var(--muted); }

/* the playground */
.play { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; min-width: 0; }
.task { padding: 16px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.task p { margin: 0; }
.taskhead { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.taskhead .tag { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--path); background: var(--path-bg); border-radius: 999px; padding: 2px 9px; }
.ed { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-width: 0; }
@media (max-width: 980px) { .ed { grid-template-columns: minmax(0, 1fr); } }
.editor { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; border-right: 1px solid var(--line); min-width: 0; }
@media (max-width: 980px) { .editor { border-right: 0; border-bottom: 1px solid var(--line); } }
.tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); background: var(--code-bg); }
.tab { border: 0; background: none; padding: 8px 12px; font: 600 13px var(--mono); color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; min-height: 40px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--hint); margin-left: 6px; vertical-align: middle; }
textarea.code { width: 100%; min-height: 260px; resize: vertical; border: 0; outline: none; background: var(--code-bg); color: var(--fg); font: 13.5px/1.6 var(--mono); padding: 12px 14px; white-space: pre; overflow: auto; tab-size: 2; display: block; }
@media (pointer: coarse) { textarea.code { font-size: 16px; } }
.edbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; border-top: 1px solid var(--line); }
.edbar .grow { flex: 1; }
.kbd { font: 12px var(--mono); color: var(--muted); }
@media (pointer: coarse) { .kbd { display: none; } }
.preview { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; }
.pvbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); font: 600 12px var(--mono); color: var(--muted); }
.pvbar .grow { flex: 1; }
.stagewrap { overflow-x: auto; background: var(--sunk); padding: 12px; min-height: 200px; }
.stage { margin: 0 auto; width: 100%; background: var(--surface); border-radius: 10px; overflow: hidden; border: 1px solid var(--line); transition: width .25s; }
.console { margin: 0; border-top: 1px solid var(--line); background: var(--code-bg); font: 12.5px/1.5 var(--mono); padding: 8px 12px; min-height: 40px; max-height: 140px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
.console .err { color: var(--fail); }
.console .out { color: var(--fg); }
.verdict { margin: 0 16px 16px; border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.verdict.ok { background: var(--pass-bg); color: var(--pass); }
.verdict.no { background: var(--fail-bg); color: var(--fail); }
.verdict.clue { background: var(--hint-bg); color: var(--hint); }
.verdict p { margin: 0; color: var(--fg); }
.help { display: flex; flex-wrap: wrap; gap: 8px; }

/* the check question */
.quiz { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.quiz .q { margin: 0; font-weight: 600; font-size: 17px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; min-height: 48px; display: flex; gap: 10px; align-items: center; }
.opt .k { font: 600 13px var(--mono); color: var(--muted); }
.opt.right { border-color: var(--pass); background: var(--pass-bg); }
.opt.wrong { border-color: var(--fail); background: var(--fail-bg); }
.opt[disabled] { cursor: default; }
.why { margin: 0; font-size: 15px; }

.where { display: grid; gap: 6px; font-size: 15px; }
.where ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.nav { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
@media (prefers-reduced-motion: reduce) { .stage, .meter i { transition: none; } }
/* Guiding AI: the cheat sheet and one situation at a time */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.sheet ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.sheet li::marker { font: 600 13px var(--mono); color: var(--accent); }
.sheet li b { display: block; }
.sheet li span { color: var(--muted); font-size: 15px; }
.judge { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.jtop { display: flex; align-items: center; gap: 10px; }
.jdots { display: flex; gap: 5px; margin-left: auto; }
.jdots i { width: 22px; height: 4px; border-radius: 2px; background: var(--line); }
.jdots i.ok { background: var(--pass); } .jdots i.no { background: var(--fail); } .jdots i.now { background: var(--accent); }
.judge .sit { margin: 0; font-size: 17px; }
.judge .who { font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--path); }
.judge .clue { background: var(--hint-bg); color: var(--fg); border-radius: 10px; padding: 10px 12px; margin: 0; }
.judge .clue b { color: var(--hint); }
.score { font: 800 22px var(--display); }
</style>

</div>

<script type="text/plain" id="r-css">
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; border: 1px solid var(--line); background: var(--surface);
  color: var(--fg); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--accent-ink);
  border-color: var(--accent); font-weight: 600; }
</script>
<script type="text/plain" id="r-tokens">
/* tokens.css: the light look */
:root {
  --bg: #eef1f4;          /* the page */
  --surface: #ffffff;     /* cards, rows, the drawer */
  --accent: #2346d1;      /* the one thing to do next */
}

/* the Dusk look: the same names, new values */
:root[data-theme="dusk"] {
  --bg: #07070f; --surface: #13121c;
  --accent: #5b8cff;
}

/* page.html: switching looks is one attribute */
function applyLook(look) {
  document.documentElement.setAttribute("data-theme", look);
}
</script>
<script type="text/plain" id="r-layout">
.wrap { max-width: var(--col); margin: 0 auto; padding-inline: 16px;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }

.card { background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
</script>
<script type="text/plain" id="r-phone">
/* Phones: every button at least 44px tall, so a thumb can hit it */
@media (pointer: coarse) { .btn { min-height: 44px; } }

/* Small phones: the Notebook button keeps its icon, hides its word */
@media (max-width: 420px) { .nblabel { position: absolute; width: 1px; height: 1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } }
</script>
<script type="text/plain" id="r-js">
// Everything the learner has done, as one plain object
let progress = { solved: {}, days: [], lessons: {}, gotchas: {}, current: null };

// One lesson's record: get it, or make an empty one the first time
const lp = id => progress.lessons[id] || (progress.lessons[id] = { step: 0, checked: null, done: false });
</script>
<script type="text/plain" id="r-dom">
const $ = id => document.getElementById(id);

function show(view) {
  $("home").hidden = view !== "home";
  $("lesson").hidden = view !== "lesson";
  $("done").hidden = view !== "done";
  $("search").hidden = view !== "search";
}
</script>
<script type="text/plain" id="r-render">
// Make text safe to put inside HTML: < becomes &lt; and so on
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Lesson text may use `code` and **bold**: escape first, then add those two
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const md = s => inline(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");

    "An **element** is an opening tag, its content, and a closing tag: `<button>Start</button>`. Elements sit inside each other like boxes in boxes.",
    "**Attributes** add information to an element. Four matter most in Daily Drill: `class` (a name for CSS to style), `id` (a unique name JavaScript can find), `hidden` (don't show this), and `data-` attributes, which are your own labels.",
    "Daily Drill's HTML is mostly **empty boxes**: `<main id=\"home\"></main>` has nothing inside until JavaScript fills it with your path. And the buttons JavaScript draws carry a label like `data-open=\"split_by_key\"`, which tells the script which lesson to open. You'll use that in lesson 10.",
  ],
  key: "class is for CSS, id is for JavaScript, data- carries your own information.",
  real: { id: "r-html", file: "src/drill/content/page.html", sub: "the screens, and a button the script draws", note: "Four `<main>` screens; all but one are `hidden` at any moment. The button's `data-open` names the lesson it opens." },
  play: { html: "p2-html", css: "p2-css", tab: "html" },
  task: "Add a third button for the lesson **Precision and recall**. Give it `class=\"btn\"` and `data-open=\"precision_recall\"`.",
  check: (r) => { const b = r.querySelector('button[data-open="precision_recall"]'); if (!b) return [false, "No button with data-open=\"precision_recall\" yet. Check the spelling and the quotes."]; if (!b.classList.contains("btn")) return [false, "The button is there but has no class=\"btn\", so it isn't styled like the others."]; return [true, "That's exactly what Home's buttons look like. Notice the hidden paragraph stays hidden."]; },
  clue: "Copy one of the existing `<button ...>...</button>` lines, then change the `data-open` value and the words.",
  answer: { html: "a2-html" },
  quiz: { q: "What does the hidden attribute do?", opts: ["Deletes the element", "Keeps the element on the page but doesn't show it", "Makes it see-through but still clickable"], a: 1, why: "The element is still there, so JavaScript can show it again by removing hidden. That's how Daily Drill switches screens." },

{ id: "css", part: 1, title: "CSS: rules that style elements",
  idea: [
    "A CSS **rule** is a selector and some declarations: `.btn { padding: 8px 14px; }`. The **selector** picks elements; each **declaration** is a property and a value.",
    "A dot means a class: `.btn` picks every element with `class=\"btn\"`. Two classes stuck together, `.btn.primary`, pick only elements that have **both**. That's how Daily Drill makes one main button per screen stand out: every button is `.btn`, and the one next step is also `.primary`.",
    "When two rules set the same property, the more specific one wins (`.btn.primary` beats `.btn`), and if they're equal, the later one wins.",
  ],
  key: "Selector picks, property says what, value says how much.",
  real: { id: "r-css", file: "src/drill/content/page.html", sub: "every button, and the one primary", note: "`.primary` only changes colours and weight; everything else comes from `.btn`. Search the file for `.btn.primary {`." },
  play: { html: "p3-html", css: "p3-css", tab: "css" },
  task: "Give **every** button rounded corners (`border-radius: 10px`), and make **only the primary** one bold (`font-weight: 600`).",
  check: (r) => { const [back, next] = r.querySelectorAll("button"); if (!back || !next) return [false, "Keep both buttons in the HTML."]; const a = getComputedStyle(back), b = getComputedStyle(next); if (a.borderTopLeftRadius !== "10px" || b.borderTopLeftRadius !== "10px") return [false, "Both buttons need border-radius: 10px. Put it in the .btn rule so it reaches both."]; if (+b.fontWeight < 600) return [false, "The primary button isn't bold yet. Add font-weight: 600 to .btn.primary."]; if (+a.fontWeight >= 600) return [false, "Back is bold too. Only .btn.primary should be bold."]; return [true, "Shared looks go in .btn, the difference goes in .btn.primary. Same as the real file."]; },
  clue: "Corners for everyone go in `.btn { }`. Bold for one goes in `.btn.primary { }`. Each declaration ends with `;`.",
  answer: { css: "a3-css" },
  quiz: { q: "Which selector picks <button class=\"btn primary\"> but not <button class=\"btn\">?", opts: [".btn", ".btn.primary", "button"], a: 1, why: ".btn.primary needs both classes. The other two pick both buttons." },
},
{ id: "tokens", part: 1, title: "Tokens: name a colour once",
  idea: [
    "Daily Drill's blue appears in dozens of places. Instead of typing `#2346d1` each time, it's **named once**: `--accent: #2346d1;`. Everywhere else says `var(--accent)`. These named values are called **design tokens** (or CSS custom properties).",
    "Change the value in one place and every button, ring and highlight follows. That's also how the **looks** work: Light and Dusk use the same names with different values. Switching looks just changes one attribute, `data-theme`, on the page.",
    "All of Daily Drill's tokens live in `src/drill/content/tokens.css`. The build pastes that file into the page. The rule in this project: **never a raw colour in a component**, always a token.",
  ],
  key: "Name it once with --name, use it everywhere with var(--name).",
  real: { id: "r-tokens", file: "src/drill/content/tokens.css + page.html", sub: "two looks, one set of names", note: "The real file has about 45 colours, plus fonts and timings. docs/DESIGN_SYSTEM.md lists what each one is for." },
  play: { html: "p4-html", css: "p4-css", tab: "css" },
  task: "Switch the preview to **Dusk**: the button stays dark blue. Add `--accent: #5b8cff;` to the Dusk block so it gets Dusk's blue.",
  check: (r, ctx) => { const b = r.querySelector(".btn.primary"); if (!b) return [false, "Keep the primary button in the HTML."]; const was = ctx.page.getAttribute("data-theme"); ctx.page.setAttribute("data-theme", "dusk"); const dusk = getComputedStyle(b).backgroundColor; ctx.page.setAttribute("data-theme", "light"); const light = getComputedStyle(b).backgroundColor; ctx.page.setAttribute("data-theme", was || "light"); if (light !== "rgb(35, 70, 209)") return [false, "In Light the button should still be #2346d1. Leave the first block as it was."]; if (dusk !== "rgb(91, 140, 255)") return [false, "In Dusk the button isn't #5b8cff yet. Add --accent to the .page[data-theme=\"dusk\"] block."]; return [true, "One value changed, and everything using var(--accent) follows. That's the whole trick behind Daily Drill's looks."]; },
  clue: "The second block, `.page[data-theme=\"dusk\"] { }`, only redefines names. Add a line inside it that redefines `--accent`.",
  answer: { css: "a4-css" },
  quiz: { q: "You want every Dusk button to be a different blue. Where do you change it?", opts: ["In every button's rule", "The --accent value in the Dusk block of tokens.css", "In the HTML of each button"], a: 1, why: "Components only say var(--accent). Changing the token changes them all, and only in that look." },
},
{ id: "layout", part: 1, title: "Layout: rows, columns and gaps",
  idea: [
    "By default, block elements stack top to bottom and small ones (like `<span>`) flow along a line. To arrange things on purpose, CSS has two tools:",
    "**Flexbox** (`display: flex`) puts children in a row. `flex-wrap: wrap` lets them move to the next line when they run out of room. **Grid** (`display: grid`) makes columns and rows. Both use `gap` for the space between children, instead of margins on each child.",
    "Daily Drill uses one reading column: `.wrap` is a grid at most `--col` (760px) wide, centred. Cards are grids too. One small trick appears everywhere: `min-width: 0`, which lets long code scroll inside its box instead of pushing the page wider than the phone.",
  ],
  key: "Flex for a row, grid for columns, gap for the space between.",
  real: { id: "r-layout", file: "src/drill/content/page.html", sub: "the column and the card", note: "Search for `.wrap {`. Every screen sits in this one column." },
  play: { html: "p5-html", css: "p5-css", tab: "css" },
  task: "Make the six phase chips sit in a **row that wraps**, with **8px** between them. Try the Phone button to see them wrap.",
  check: (r) => { const c = r.querySelector(".chips"); if (!c) return [false, "Keep the .chips box in the HTML."]; const s = getComputedStyle(c); if (s.display !== "flex" && s.display !== "inline-flex") return [false, "The chips aren't in a row yet. Add display: flex to .chips."]; if (s.flexWrap !== "wrap") return [false, "They're in a row but won't wrap. Add flex-wrap: wrap."]; if (s.columnGap !== "8px" || s.rowGap !== "8px") return [false, "Add gap: 8px for the space between chips."]; return [true, "That's the pattern for chips, tags and buttons in a row all over Daily Drill."]; },
  clue: "Three declarations inside `.chips { }`: one for the row, one for wrapping, one for the space.",
  answer: { css: "a5-css" },
  quiz: { q: "Why use gap instead of a margin on each chip?", opts: ["gap is faster to load", "gap puts space only between children, never at the edges", "margins don't work in flexbox"], a: 1, why: "A margin on each child also adds space at the ends, and margins can double up. gap is just the space between." },
},

  idea: [

    "An **object** groups named values: `{ step: 3, done: true }`. Read a value with a dot: `record.done`. Daily Drill keeps everything you've done in one object called `progress`.",

    "So adding a button is two steps: draw it with a new `data-` label, and add one line to that one listener.",
  ],

  clue: "Under the `const open = ...` line: `if (open) { $(\"picked\").textContent = open.dataset.open; }`. `dataset.open` reads `data-open`.",

  clue: "Step 1: `const raw = localStorage.getItem(KEY); if (raw) state = JSON.parse(raw);` Step 2: `localStorage.setItem(KEY, JSON.stringify(state));` Wrap each in try { } catch { }.",

// ---------- Guiding AI: a cheat sheet, then one situation at a time ----------
// One primary button per screen: "next lesson" only becomes primary once this lesson is done
function navHtml(i, quiet) {
  const primary = S.done[L[i].id] && !quiet ? " primary" : "";
  return `<nav class="nav" aria-label="Lessons">
      ${i > 0 ? `<button class="btn" data-go="${i - 1}">← ${esc(L[i - 1].title)}</button>` : "<span></span>"}
      ${i < L.length - 1 ? `<button class="btn${primary}" data-go="${i + 1}">Next: ${esc(L[i + 1].title)} →</button>` : ""}
    </nav>`;
}
function whereNext() {
  return `<section class="where sec"><h2>Where to go next</h2><ul>
      <li><b>docs/FRONTEND.md</b>: the map of every section in page.html, and recipes for common changes.</li>
      <li><b>docs/DESIGN_SYSTEM.md</b>: every token and component, and how to change them safely.</li>
      <li><b>docs/screens/</b>: a picture of every screen, with the function that draws it.</li>
      <li>A good first real change: add one line of help text somewhere, using the request from "Asking well, then checking". Run <code>scripts/check.sh</code> and look at it at 375px in Dusk and Light.</li></ul></section>`;
}

  const dots = x.cases.map((cs, k) => `<i class="${J.picks[k] == null ? (k === J.at ? "now" : "") : J.picks[k] === cs.a ? "ok" : "no"}"></i>`).join("");
  const body = finished && J.at === n ? `
      <div class="eyebrow">All ${n} done</div>

      <div class="jtop"><span class="eyebrow">Situation ${J.at + 1} of ${n}</span><span class="jdots" aria-hidden="true">${dots}</span></div>

      ${pick != null ? `<p class="why"><b>${pick === c.a ? "Right." : `It's ${"ABC"[spin(c.sit, c.opts.length).indexOf(c.a)]}.`}</b> ${esc(c.why)}</p>` : ""}
      <div class="help">${pick == null ? (J.clue[J.at] ? "" : '<button class="btn small" data-jclue>Give me a clue</button>') : `<button class="btn primary" data-jgo="${J.at + 1}">${J.at + 1 < n ? "Next situation" : "See how you did"}</button>`}</div>`;

// ---------- the playground ----------
function setupPlay(x) {
  const draft = S.drafts[x.id] || {};
  const src = {}; for (const k of ["html", "css", "js"]) src[k] = draft[k] != null ? draft[k] : (x.play[k] ? text(x.play[k]) : "");
  const stage = $("stage"), root = stage.attachShadow({ mode: "open" });
  pg = { x, src, tab: x.play.tab, stage, root, theme: "light", logs: [], help: 0 };
  showTab(pg.tab);
  run();
  markPv();
}
function showTab(k) {
  pg.tab = k;
  document.querySelectorAll("[data-tab]").forEach(b => { b.setAttribute("aria-selected", String(b.dataset.tab === k)); });
  $("code").value = pg.src[k];
}
function out(cls, parts) {
  const line = parts.map(v => typeof v === "string" ? v : (() => { try { return JSON.stringify(v); } catch { return String(v); } })()).join(" ");
  pg.logs.push(line);
  const c = $("console"); const s = document.createElement("div"); s.className = cls; s.textContent = line; c.appendChild(s); c.scrollTop = c.scrollHeight;
}
function run() {
  const { root, src } = pg;
  pg.logs = []; $("console").textContent = "";
  root.innerHTML = `<style>${BASE}${src.css}</style><div class="page" data-theme="${pg.theme}">${src.html}</div>`;
  pg.page = root.querySelector(".page");
  // "root" in the lesson code is the preview's page box: it's redrawn each run, so old listeners go with it.
  if (src.js.trim()) {
    try { new Function("root", "$", "log", src.js)(pg.page, id => root.getElementById(id), (...a) => out("out", a)); }
    catch (e) { out("err", [String(e && e.message || e)]); }
  }
  if (!pg.logs.length) $("console").innerHTML = '<span>Nothing logged. log("…") in JavaScript writes here.</span>';
}
function ctx() {
  return { root: pg.root, page: pg.page, stage: pg.stage, logs: pg.logs, src: pg.src, $: id => pg.root.getElementById(id), run: () => run() };
}
function verdict(kind, title, body) {
  $("verdict").innerHTML = `<div class="verdict ${kind}" role="status"><b>${esc(title)}</b><p>${inline(body)}</p>${kind === "no" ? `<div class="help">${pg.help === 0 ? '<button class="btn small" id="clueBtn">Give me a clue</button>' : '<button class="btn small" id="ansBtn">Show me the answer</button>'}</div>` : ""}</div>`;
}
function check() {
  pg.src[pg.tab] = $("code").value; run();
  let res;
  try { res = pg.x.check(pg.root, ctx()); } catch (e) { res = [false, "Something in the code stopped it: " + (e.message || e)]; }
  run();
  if (res[0]) { S.done[pg.x.id] = true; save(); renderOutline(); verdict("ok", "That works.", res[1]); $("runBtn").classList.remove("primary"); document.querySelector(".nav .btn:last-child")?.classList.add("primary"); const tag = document.querySelector(".taskhead"); if (tag && !/Done/.test(tag.textContent)) tag.insertAdjacentHTML("beforeend", '<span class="eyebrow" style="color:var(--pass)">✓ Done</span>'); }
  else verdict("no", "Not yet.", res[1]);
}
function saveDraft() { S.drafts[pg.x.id] = Object.assign({}, pg.src); save(); }
function markPv() {
  document.querySelectorAll("[data-pv]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.pv === pg.theme)));
  document.querySelectorAll("[data-w]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.w === (pg.stage.style.width === "375px" ? "375" : ""))));
}

// ---------- events: one listener, like Daily Drill ----------
document.addEventListener("click", e => {
  const t = e.target;
  const go = t.closest("[data-go]"); if (go) { S.at = +go.dataset.go; save(); renderOutline(); renderLesson(); try { history.replaceState(null, "", "#" + L[S.at].id); } catch {} window.scrollTo({ top: 0, behavior: "smooth" }); if (window.innerWidth <= 860) { $("outline").classList.remove("open"); $("outToggle").setAttribute("aria-expanded", "false"); } return; }
  const tab = t.closest("[data-tab]"); if (tab) { pg.src[pg.tab] = $("code").value; showTab(tab.dataset.tab); return; }
  if (t.closest("#runBtn")) { pg.src[pg.tab] = $("code").value; saveDraft(); run(); return; }
  if (t.closest("#checkBtn")) { saveDraft(); check(); return; }
  if (t.closest("#resetBtn")) { delete S.drafts[pg.x.id]; save(); renderLesson(); return; }
  if (t.closest("#clueBtn")) { pg.help = 1; $("verdict").innerHTML = `<div class="verdict clue" role="status"><b>A clue</b><p>${inline(pg.x.clue)}</p><div class="help"><button class="btn small" id="ansBtn">Show me the answer</button></div></div>`; return; }
  if (t.closest("#ansBtn")) { for (const k in pg.x.answer) pg.src[k] = text(pg.x.answer[k]); showTab(Object.keys(pg.x.answer)[0]); saveDraft(); run(); $("verdict").innerHTML = `<div class="verdict clue" role="status"><b>Here's one way</b><p>Read it line by line and compare it with yours, then press Check my work.</p></div>`; return; }
  const w = t.closest("[data-w]"); if (w) { pg.stage.style.width = w.dataset.w ? w.dataset.w + "px" : ""; markPv(); return; }
  const pv = t.closest("[data-pv]"); if (pv) { pg.theme = pv.dataset.pv; if (pg.page) pg.page.setAttribute("data-theme", pg.theme); markPv(); return; }
  const opt = t.closest("[data-opt]"); if (opt) { S.quiz[L[S.at].id] = +opt.dataset.opt; save(); const y = window.scrollY; renderLesson(); window.scrollTo(0, y); return; }
  const jp = t.closest("[data-jpick]"); if (jp) { const x = L[S.at], J = S.judge[x.id]; if (J.picks[J.at] == null) { J.picks[J.at] = +jp.dataset.jpick; if (Object.keys(J.picks).length === x.cases.length) { S.done[x.id] = true; renderOutline(); } save(); } const y = window.scrollY; renderLesson(); window.scrollTo(0, y); return; }
  if (t.closest("[data-jclue]")) { const J = S.judge[L[S.at].id]; J.clue[J.at] = true; save(); const y = window.scrollY; renderLesson(); window.scrollTo(0, y); return; }
  const jg = t.closest("[data-jgo]"); if (jg) { const J = S.judge[L[S.at].id]; J.at = +jg.dataset.jgo; save(); renderLesson(); document.querySelector(".judge")?.scrollIntoView({ block: "center" }); return; }
  if (t.closest("[data-jreset]")) { delete S.judge[L[S.at].id]; delete S.done[L[S.at].id]; save(); renderOutline(); renderLesson(); return; }
  if (t.closest("#outToggle")) { const o = $("outline").classList.toggle("open"); $("outToggle").setAttribute("aria-expanded", String(o)); return; }
});
document.addEventListener("keydown", e => {
  if (e.target.id !== "code") return;
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); pg.src[pg.tab] = e.target.value; saveDraft(); run(); return; }
  if (e.key === "Tab" && !e.shiftKey && !e.altKey) {
    e.preventDefault(); const ta = e.target, s = ta.selectionStart, en = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + "  " + ta.value.slice(en); ta.selectionStart = ta.selectionEnd = s + 2; pg.src[pg.tab] = ta.value;
  }
});
document.addEventListener("input", e => { if (e.target.id === "code" && pg) { pg.src[pg.tab] = e.target.value; clearTimeout(pg.t); pg.t = setTimeout(saveDraft, 500); } });

// ---------- boot ----------
renderOutline();
renderLesson();
})();
</script>
